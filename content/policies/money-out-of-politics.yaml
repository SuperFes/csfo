slug: money-out-of-politics
title: Get big money out of politics
tagline: "Super PACs spent a record $2.7 billion in 2024; 72% of Americans want limits on campaign spending"
category: democracy-and-ethics
status: needs-review
review_note: >
  The 2026 polls cited use opt-in online panels.
summary: >
  Overturn Citizens United with a constitutional amendment that lets Congress and
  the states limit election spending, require disclosure of "dark money" donors,
  and ban members of Congress from trading individual stocks.
problem: >
  Since Citizens United (2010), super PACs spent about $6.4 billion on federal
  elections through 2022 and a record of at least $2.7 billion in 2024 alone.
  Dark money spending grew from under $5 million in 2006 to more than $1 billion
  in the 2024 presidential election (Brennan Center). Pew found 80% of Americans
  say big campaign donors have too much influence on Congress, and 81% say
  members do a bad job of keeping their personal financial interests separate
  from their work.
peers: null
record: >
  Senate Democrats have held floor votes but have not changed Senate rules to pass
  reform. A constitutional amendment to overturn Citizens United (S.J.Res. 19)
  failed cloture 54–42 in September 2014. The DISCLOSE Act failed cloture 49–49
  on September 22, 2022, with every Republican present voting no. In January 2022,
  Schumer's attempt to change the filibuster rule to pass the Freedom to Vote
  Act, which included disclosure provisions, failed 52–48 when Manchin and Sinema
  joined Republicans. Democrats also did not pass a
  congressional stock-trading ban while they controlled both chambers in 2021–22.
  In the minority, every Senate Democrat voted against cloture on the motion to
  proceed to the House-passed Stop Insider Trading Act (H.R. 7008), which failed
  53–47 on September 30, 2026. The bill barred new stock purchases but let members
  keep, and later sell, stocks they already held, and House Republicans had combined
  it with a photo voter ID requirement (NOTUS). Democrats argued it did not go far
  enough and objected to the voter ID language; Schumer called it "a permission slip
  for corruption, not a stock trading ban" (WEAR). As of November 2026, no ban has
  become law.
