polling:
  - pollster: Pew Research Center
    date: 2023-07-16  # report draws on surveys fielded June 5–11 and July 10–16, 2023; item-level date not stated
    question: >
      Should there be limits on the amount of money individuals and organizations
      can spend on political campaigns? (published Sept. 19, 2023)
    result: "72% say yes (Democrats 76%, Republicans 71%)"
    url: https://www.pewresearch.org/politics/2023/09/19/money-power-and-the-influence-of-ordinary-people-in-american-politics/
  - pollster: Program for Public Consultation, University of Maryland
    date: 2026-02-26
    question: >
      A constitutional amendment allowing Congress and state legislatures to
      restrict or prohibit corporate and PAC election spending (national, 2,509
      adults, Feb. 11–26, 2026; opt-in online panels).
    result: "82% favor (Democrats 85%, Republicans 82%)"
    url: https://publicconsultation.org/redistricting/major-political-reforms-favored-by-both-democrats-and-republicans-in-the-battlegrounds/
  - pollster: Program for Public Consultation, University of Maryland
    date: 2026-02-26
    question: >
      Prohibit members of Congress from trading individual company stocks while
      still allowing broad funds (national, Feb. 11–26, 2026).
    result: "76% favor (Democrats 75%, Republicans 78%)"
    url: https://publicconsultation.org/redistricting/major-political-reforms-favored-by-both-democrats-and-republicans-in-the-battlegrounds/
  - pollster: Program for Public Consultation, University of Maryland
    date: 2023-05-30
    question: >
      Prohibit stock trading in individual companies by members of Congress
      (2,625 registered voters, probability-based sample, May 19–30, 2023).
    result: "86% favor (Republicans 87%, Democrats 88%, independents 81%)"
    url: https://publicconsultation.org/united-states/stock-trading-by-members-of-congress/
