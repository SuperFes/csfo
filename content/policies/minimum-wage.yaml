slug: minimum-wage
title: A living federal minimum wage
tagline: "$7.25 since July 2009, the longest freeze in the federal minimum wage's history"
category: wages-and-labor
status: verified
summary: >
  Raise the federal minimum wage from $7.25 an hour (the main Democratic proposal
  has been $15) and index it so it keeps pace with prices and wages.
problem: >
  The federal minimum has been $7.25 since July 24, 2009, more than 17 years and
  the longest stretch without an increase since it was created in 1938. Inflation
  has cut its buying power by about 36%: $7.25 in October 2026 buys what $4.63
  bought in July 2009, and simply matching 2009's value would take $11.36. Twenty
  states still use $7.25 as their floor.
peers: null
record: >
  Congress has not raised the minimum wage since the step that took effect in
  July 2009. In 2021, with Democrats controlling Congress, a $15 increase was
  dropped from the American Rescue Plan after the parliamentarian's ruling. On March 5, 2021, Sanders' motion to waive budget rules
  and restore it failed 42–58, with
  eight Democratic-caucus senators voting no (Carper, Coons, Hassan, King, Manchin,
  Shaheen, Sinema, Tester). Even with every Democrat, a standalone bill would have
  needed 10 Republican votes to clear the filibuster.
