slug: pro-act-labor-rights
title: The freedom to form a union (PRO Act)
tagline: "71% of Americans approve of unions, but just 10% of workers belong to one"
category: wages-and-labor
status: needs-review
review_note: >
  The 2023 and 2025 Senate versions and the summary of the bill's provisions are not yet tied to a primary source.
summary: >
  The PRO Act would strengthen workers' ability to organize. It adds penalties for
  employers who illegally retaliate against organizers, limits captive-audience
  anti-union meetings, and overrides state "right-to-work" laws that let workers
  covered by a union contract opt out of paying for representation.
problem: >
  Union membership was 10.0% of wage and salary workers in 2025 (5.9% in the
  private sector), down from 20.1% in 1983, per BLS. That decline has happened
  even as public approval of unions sits near its modern high. In a 2025 Pew
  survey, 62% of adults said the decline in union membership has been bad for
  working people.
peers: null
record: >
  The House passed the PRO Act 225–206 on March 9, 2021, with all but one
  Democrat in favor. Senate versions were introduced in every Congress since
  (S.420 in 2021, S.567 in 2023, S.852 in 2025), but none got a floor vote while
  Democrats held the majority from 2021 to 2025. The bill never had the 60 votes
  needed to overcome a filibuster, and three Democratic-caucus senators (Sinema, Kelly
  and Warner) never cosponsored the 2021 version.
