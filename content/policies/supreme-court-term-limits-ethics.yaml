slug: supreme-court-term-limits-ethics
title: Supreme Court term limits and an enforceable ethics code
tagline: "Supreme Court approval hit a record-low 33% in 2026, and its ethics code has no enforcement"
category: courts
status: verified
summary: >
  Give justices fixed, staggered terms (commonly proposed as 18 years) instead of
  life tenure, and require a binding Supreme Court ethics code with an independent
  way to investigate and enforce violations.
problem: >
  Gallup measured Supreme Court job approval at 33% in July 2026, the lowest in its
  trend, with 61% disapproving. The Court adopted its first written Code of Conduct
  in November 2023 after reports on undisclosed gifts to justices. The justices
  described the code as a codification of principles they had long followed, and
  it names no one to decide whether a justice has broken it.
peers: null
record: >
  Sen. Sheldon Whitehouse's Supreme Court Ethics, Recusal, and Transparency Act,
  which would require an enforceable code investigated by panels of appellate
  judges, cleared the Democratic-led Senate Judiciary Committee on a party-line
  vote in July 2023. It then stalled because of Republican opposition and did not
  get a Senate floor vote under Majority Leader Schumer: after it was reported on
  Sept. 5, 2023 it sat on the Senate calendar for the rest of the Congress.
