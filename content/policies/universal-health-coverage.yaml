slug: universal-health-coverage
title: Health coverage for everyone
tagline: "U.S. health spending is nearly double its peers' per person, yet 26.7 million have no coverage"
category: healthcare
status: verified
summary: >
  Guarantee health coverage to every resident, either through a public option
  anyone can buy into or a single national plan (Medicare for All). Every other
  wealthy nation guarantees coverage in some form.
problem: >
  In 2025, 26.7 million people (7.9%) had no health insurance for the entire year,
  according to the Census Bureau. Coverage is now eroding: the Commonwealth Fund
  found the uninsured rate among working-age adults rose from 8.9% in 2024 to
  11.2% in 2026, and 46% of working-age adults were uninsured, had a coverage gap,
  or were underinsured. About 20 million adults owe medical debt, and the total
  owed is at least $220 billion (Peterson-KFF, using December 2021 SIPP data).
peers: >
  The U.S. spent $14,775 per person on health in 2024, compared with an average
  of $7,860 in comparable wealthy countries. Even so, U.S. life expectancy (79.0
  years in 2024) trails the peer average (82.7 years) by about 3.7 years.
record: >
  Democrats passed the ACA in 2010 without a public option. Enhanced ACA premium subsidies came in the 2021 American
  Rescue Plan, and Democrats' 2022 Inflation Reduction Act extended them only
  through 2025, which set up the expiration cliff. In fall 2025 Senate Democrats
  forced a record-long shutdown over the subsidies. It ended on November 10, 2025,
  when eight Democratic-caucus senators voted with Republicans (Schumer voted no)
  in exchange for only a promise of a vote. That vote came on December 11, 2025,
  and the Democratic three-year extension failed 51–48, short of the 60 needed.
