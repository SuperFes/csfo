polling:
  - pollster: KFF Health Tracking Poll
    date: 2026-09-21
    question: >
      Favor or oppose a national health plan, sometimes called Medicare for All,
      in which all Americans would get their insurance from a single government
      plan (fielded Sept. 16–21, 2026).
    result: "66% favor, 34% oppose (Democrats 84%, independents 72%, Republicans 34% favor)"
    url: https://www.kff.org/public-opinion/current-and-historical-public-opinion-on-medicare-for-all-and-other-national-health-plan-proposals/
  - pollster: KFF Health Tracking Poll
    date: 2026-09-21
    question: >
      Same national health plan question, after respondents were told it would
      eliminate private insurance plans.
    result: "52% favor"
    url: https://www.kff.org/public-opinion/current-and-historical-public-opinion-on-medicare-for-all-and-other-national-health-plan-proposals/
  - pollster: West Health-Gallup
    date: 2025-11-25
    question: >
      Is it the responsibility of the federal government to make sure all
      Americans have health care coverage? (survey fielded November 2025)
    result: "Almost two-thirds say yes (per Gallup's Frank Newport, Jan. 2026)"
    url: https://news.gallup.com/opinion/polling-matters/700268/history-suggests-next-move-healthcare.aspx
