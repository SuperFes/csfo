slug: prescription-drug-prices
title: Fair prices for prescription drugs
tagline: "Americans pay 2.78x what other wealthy countries pay for prescription drugs"
category: healthcare
status: verified
summary: >
  Let the government negotiate drug prices for everyone, not just a few drugs in
  Medicare, and cap what patients pay out of pocket, so Americans stop paying
  several times what patients in other wealthy countries pay for the same medicines.
problem: >
  HHS analysts found U.S. prescription drug prices in 2022 were nearly 2.78 times
  prices in comparison countries, and at least 3.22 times as high for brand-name
  drugs even after estimated rebates. A KFF poll found about a quarter of adults
  have difficulty affording their prescriptions, rising to 37% among people taking
  four or more.
peers: >
  Other wealthy countries negotiate or regulate drug prices nationally. That is
  the main reason HHS found U.S. prices are nearly three times theirs.
record: >
  Democrats' Inflation Reduction Act, passed 50–50 with Vice President Harris
  breaking the tie in August 2022, let Medicare negotiate prices for the first
  time, capped Part D out-of-pocket costs at $2,000 starting in 2025, capped
  Medicare insulin at $35 a month, and required inflation rebates. Negotiation is
  limited to Medicare and phased in slowly: 10 drugs with prices effective in 2026,
  15 in 2027, and 15 more (including Part B) in 2028. Privately insured patients
  get no negotiated prices. CBO estimated the negotiation provision saves Medicare
  $98.5 billion over 2022–2031.
