slug: child-care-and-pre-k
title: Affordable child care and universal pre-K
tagline: "Child care averaged $13,128 a year in 2024, and only 37% of 4-year-olds attend state pre-K"
category: families
status: verified
summary: >
  Federal funding to cap what families pay for child care and to make free,
  high-quality pre-kindergarten available to every 3- and 4-year-old.
problem: >
  The national average price of child care was $13,128 in 2024, which equals 10% of
  median income for a married couple with children and 35% for a single parent
  (Child Care Aware of America). BLS price data show day care and preschool prices
  rose about 22% from January 2020 to September 2024. Only 37% of 4-year-olds and
  9% of 3-year-olds were enrolled in state-funded preschool in 2024–25, and six
  states fund no qualifying program.
peers: null
record: >
  Universal pre-K and federal child care subsidies were the core of the
  House-passed Build Back Better Act, which died in the 50–50 Senate after
  Sen. Joe Manchin withdrew support. There is still no
  federal guarantee of affordable child care or pre-K, so access depends on
  state programs, and six states fund no qualifying pre-K program at all.
