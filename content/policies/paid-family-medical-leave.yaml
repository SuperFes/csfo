slug: paid-family-medical-leave
title: National paid family and medical leave
tagline: "The U.S. was the only one of 41 wealthy nations studied that guarantees new parents no paid leave"
category: families
status: verified
summary: >
  A national insurance program that pays workers part of their wages while they
  take time off to care for a new child, a seriously ill family member, or their
  own serious health condition.
problem: >
  No federal law guarantees private-sector workers paid family or medical leave.
  The FMLA guarantees only unpaid, job-protected leave. In March 2026, 49% of
  private-industry workers had access to paid family and medical leave through
  their employer, per BLS. In a Pew survey of working parents, 84% said paid leave
  would be extremely or very helpful, but only 50% said their job offers it.
peers: >
  Pew's analysis of OECD data (as of April 2018) found the U.S. was the only one of
  41 countries that mandates no paid leave for new parents. The smallest guarantee
  among the other 40 was about two months, and Estonia offered more than a year
  and a half.
record: >
  Congress gave federal employees 12 weeks of paid parental leave in the December
  2019 defense authorization law (P.L. 116-92, the Federal Employee Paid Leave Act).
  A national program for all workers was included in the House-passed Build Back
  Better Act but died in the 50–50 Senate. Private-sector
  workers still have no federal right to paid leave, and coverage depends on the
  employer or on the state they live in.
