slug: child-tax-credit
title: Bring back the expanded Child Tax Credit
tagline: "Child poverty hit a record-low 5.2% in 2021, then more than doubled once the credit lapsed"
category: families
status: verified
summary: >
  Restore the 2021 expanded Child Tax Credit: up to $3,000 per child ($3,600 under
  age six), fully refundable so the poorest families get the whole amount, and
  paid monthly.
problem: >
  Under the Census Bureau's Supplemental Poverty Measure, child poverty fell to
  5.2% in 2021 while the expanded credit was in effect. It more than doubled to
  12.4% in 2022 after the credit expired, and it stood at 13.4% in 2025. The 2025
  tax law raised the maximum credit to $2,200 but kept the earnings phase-in, so
  about 17 million children in low-income families still get a partial credit
  or none.
peers: null
record: >
  Democrats created the expansion in the American Rescue Plan, which passed the
  Senate 50–49 in March 2021 without a Republican vote. It covered only 2021, and
  the extension died when Build Back Better stalled in the 50–50 Senate. In August 2024, after the House passed a bipartisan
  tax bill with a partial CTC expansion 357–70, Schumer's cloture motion failed
  48–44, short of the 60 needed. Most Republicans opposed it, and Manchin and
  Sanders also voted no. Schumer switched his own vote to no as a routine
  procedural step that would let him bring the motion back.
