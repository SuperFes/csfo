slug: dscc-2020-early-endorsements
title: '2020: DSCC picked Senate nominees early, and most of its picks lost in November'
date: 2019-11-25
category: party-and-primaries
status: verified
summary: >
  Ahead of 2020, with Schumer as Democratic leader, the DSCC endorsed candidates in contested primaries,
  sometimes within days of their entry. Examples include Theresa Greenfield in Iowa, Cal Cunningham in
  North Carolina over poll-leading state Sen. Erica Smith, and John Hickenlooper in Colorado. TIME reported
  that Schumer tried to talk J.D. Scholten out of the Iowa race, reportedly telling him "We don't need
  a primary." Greenfield and Cunningham lost their general elections, as did DSCC-backed Amy McGrath in
  Kentucky.
could_have: >
  The DSCC could have let primaries run their course and invested in whoever won, rather than clearing
  fields months before voters weighed in.
context: >
  Not every pick struggled: Hickenlooper won his primary by nearly 20 points. 2020 was a presidential
  year with little ticket-splitting, and Democratic Senate candidates lost several races despite record
  fundraising, so the losses are not solely attributable to the endorsements. Iowa's Greenfield out-raised
  Sen. Joni Ernst about two-to-one and still lost by six points.
schumer_response: >
  DSCC spokesperson Stewart Boss said the committee endorses "the most viable candidates" as part of a
  national strategy to win the majority (TIME, 2019).
