slug: post-shutdown-calls-to-step-down-nov-2025
title: House Democrats and Senate candidates call for Schumer to go after shutdown ends
date: 2025-11-11
category: party-and-primaries
status: verified
summary: >
  After the shutdown deal, Rep. Ro Khanna and at least five other Congressional Progressive Caucus members
  called for Schumer to step down as minority leader, per the Washington Post. Rep. Mike Levin said Schumer
  "has not met this moment," and Michigan Senate candidate Mallory McMorrow said she would not back him
  as leader, saying "We need new leadership" (AP). MoveOn also called for him to step aside. Sen. Chris
  Murphy said Schumer "didn't want this to be the outcome" but "didn't succeed."
could_have: >
  Announce a succession plan or a date for stepping aside to defuse the issue before the 2026 campaign.
context: >
  No Democratic senator publicly called for him to resign as leader. Durbin, Welch and Whitehouse defended
  him, and Jeffries said Schumer was an effective leader and blamed the eight senators who voted for the
  deal.
schumer_response: >
  Per AP, he did not respond directly to the criticism and instead focused his public remarks on Republicans.
