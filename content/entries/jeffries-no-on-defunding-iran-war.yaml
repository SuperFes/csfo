slug: jeffries-no-on-defunding-iran-war
title: Jeffries says ending the Iran war doesn't mean cutting off its funding
date: 2026-11-17
people: [hakeem-jeffries]
category: foreign-policy
status: needs-review
review_note: >
  Still developing until the government funding deadline on Dec. 11.
summary: >
  At The Atlantic Summit on Nov. 17, Jeffries said House Democrats will "move aggressively to end the
  reckless and costly war of choice in Iran right out of the gate" once they take the majority in January.
  Asked by Jeffrey Goldberg, "What does ending the war mean? Not funding their operations in the Gulf?",
  he answered, "Well, no. It means a cessation of hostilities…. So that's what a war powers resolution is
  able to do, right?" (Truthout). The same day, he said Congress would reach either a funding deal before
  the Dec. 11 deadline or a temporary extension into next year, adding, "I don't want to get out ahead of
  that process" (Common Dreams).
could_have: >
  Commit that House Democrats will not vote for a funding bill or stopgap that keeps paying for the war, as
  Van Hollen and a group of Senate Democrats have.
context: >
  At a press conference the previous Thursday, Jeffries said, "House Democrats have uniformly opposed
  providing any additional money to Donald Trump's war machine, to Pete Hegseth's war machine over in the
  Middle East" (Truthout). Four Senate Democrats have vowed to oppose any funding package that enables the
  war. Trump can veto a war powers resolution, and Jeffries said his plan is to make a veto embarrassing for
  him (Truthout). Schumer also has not committed to using the funding bill to end the war. Jeffries is the
  House Democrats' nominee for speaker.
statement: >
  "Well, no," Jeffries said when asked whether ending the war meant not funding operations in the Gulf. "It
  means a cessation of hostilities…. So that's what a war powers resolution is able to do, right?"
