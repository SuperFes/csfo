slug: leadership-tenure-and-succession
title: A decade atop the caucus, and Schumer, 75, is running for leader again
date: 2026-10-12
category: party-and-primaries
status: verified
summary: >
  Schumer was elected Democratic leader in late 2016 and has led the caucus since January 2017. He has
  been in Congress since 1981, first in the House and in the Senate since 1999. He is 75 and turns 76
  on Nov. 23, 2026. He has told AP he is running for another term as leader, and his own Senate term runs
  through 2028. Calls for generational change have grown inside the party. Retiring whip Dick Durbin said
  it was time to "pass the torch." Rep. Ro Khanna said of Schumer, "he's not the future and we need new
  people."
could_have: >
  Schumer could announce a succession plan, or a date to step back from leadership after the 2026 majority
  was won, so the caucus could choose its next leader openly.
context: >
  Schumer's tenure is far short of the record for a party leader: Mitch McConnell passed Mike Mansfield's
  16 years in 2023. Many colleagues defend him. Sen. Ron Wyden said "You can't argue with results," and
  Sen. Richard Blumenthal said in 2025 that the caucus was "still firmly behind" him. Pollster Geoff Garin
  said there was "zero evidence" that the Senate leader affects voters' general-election choices.
schumer_response: >
  "I am staying put, and I'm fighting the fight every day, as is our caucus, in a united and successful
  way" (CNN State of the Union, April 2025). In October 2026 he told AP the caucus is "strong" and "united,"
  with "a broader map, strong candidates, a clear contrast."
