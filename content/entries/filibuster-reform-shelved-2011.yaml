slug: filibuster-reform-shelved-2011
title: >-
  With Democrats in control, Schumer helped broker a 2011 deal that kept the filibuster
date: 2011-01-27
category: filibuster-and-rules
status: verified
summary: >
  As Rules Committee chairman in 2010, Schumer led a six-hearing series, "Examining the Filibuster," saying
  the question was "should we change the Senate rules and if so, how and when." In January 2011, when
  Sens. Udall, Merkley and Harkin pushed to change the rules by majority vote, Schumer and Lamar Alexander
  negotiated a deal that ended secret holds and forced readings but left the filibuster intact; three
  filibuster changes failed to reach two-thirds. Reid and McConnell also agreed not to use the majority-vote
  "constitutional option" in that Congress or the next.
could_have: >
  With a majority at the start of the 112th Congress, Democratic leadership could have backed the majority-vote
  rules change, such as a "talking filibuster" requirement, rather than trading it away for modest procedural
  changes.
context: >
  Roll Call reported the majority-vote effort ended under pressure from both parties' leaders, and Merkley,
  Udall and Harkin publicly called the package "modest" progress. Schumer said he personally supported
  a talking filibuster. In 2013 Reid did use the nuclear option for most nominees; Schumer later said
  he had argued against including Cabinet nominees and told CNN in January 2017 he "wish[ed] it hadn't
  happened," and in the Atlantic acknowledged it "would have been easier to defeat" Trump nominees under
  the old rules.
schumer_response: >
  Schumer said Democrats did not get everything they wanted and that more work remained, adding "I believe
  in the talking filibuster" but that Senate traditions should not be discarded "with a snap of the fingers"
  (Roll Call, Jan. 27, 2011).
