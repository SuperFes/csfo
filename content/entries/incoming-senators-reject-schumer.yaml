slug: incoming-senators-reject-schumer
title: >-
  Democrats won the Senate, and several incoming senators say they won't back Schumer
date: 2026-11-08
category: party-and-primaries
status: needs-review
summary: >
  Democrats won Senate control in the Nov. 3, 2026 midterms. Several incoming Democratic senators have
  still said they will not support Schumer for majority leader: Juliana Stratton (Ill.), Adam Hamilton
  (Kan.), Troy Jackson (Maine), Abdul El-Sayed (Mich.) and Peggy Flanagan (Minn.). Others, including Chris
  Pappas (N.H.) and James Talarico (Texas), have called for new leadership or withheld commitment. Sitting
  Sens. Chris Van Hollen and Elissa Slotkin have declined to back him. Slotkin said she would not vote
  for him without a plan, and Van Hollen said there should be no "coronation." El-Sayed won his seat after
  defeating Schumer's preferred candidate in the Michigan primary.
could_have: >
  Schumer could open a contested leadership election or set out a transition timeline, rather than seeking
  another term as leader by secret ballot with no declared opponent.
context: >
  Schumer needs only a simple majority of a caucus projected at 54 to 56 members, and no senator has declared
  a challenge. Allies, including Sen. Sheldon Whitehouse, credit his candidate recruitment for putting
  red-state seats in play. Sen. Mark Kelly and others have said they will support him. The leadership
  vote is expected in early December 2026.
schumer_response: >
  "I'll be re-elected as majority leader," Schumer said. He argued the election was "not about" him: "This
  is about the American people and what they want and what they need" (Al Jazeera, Nov. 5, 2026). He told
  the New York Times, "Our caucus is focused on moving forward" (as reported by CNN).
