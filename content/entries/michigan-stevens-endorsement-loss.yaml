slug: michigan-stevens-endorsement-loss
title: Schumer backed Stevens in Michigan, and she lost despite an 11-to-1 ad advantage
date: 2026-08-05
category: party-and-primaries
status: verified
summary: >
  Schumer had privately preferred Rep. Haley Stevens for Michigan's open Senate seat. In June 2026 he
  effectively endorsed her, telling Punchbowl News, "I think she has the best chance to win." Stevens
  outspent Abdul El-Sayed on ads roughly 11-to-1, and outside groups backing her spent more than $50 million,
  according to AP. She still lost the Aug. 4 primary, about 48.5% to 47.5%, months after Schumer's Maine
  recruit had already quit. El-Sayed then beat Republican Mike Rogers on Nov. 3, 2026, by about six points
  in early counts.
could_have: >
  Schumer could have stayed out of an open, three-way primary in a state where Democratic primary voters
  were signaling a demand for change, and left the choice of nominee to them.
context: >
  The primary was very close, and Stevens won more than 60% of the vote in Detroit. Disclosed outside
  spending for Stevens included more than $30 million from the American Israel Public Affairs Committee,
  which AP called the group's largest investment ever in a single race. That spending was by an outside
  group, not by Schumer or the DSCC. El-Sayed has said he will back Sen. Chris Van Hollen, not Schumer,
  for leader. Democratic strategist Lis Smith said after the race that party leaders "value seniority
  over talent."
schumer_response: >
  Schumer said he backed Stevens because "I think she has the best chance to win" and that Democrats needed
  "multiple paths" to a majority (Punchbowl News, June 11, 2026). After the primary, Schumer and Gillibrand
  issued a joint statement backing El-Sayed.
