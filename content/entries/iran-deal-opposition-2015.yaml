slug: iran-deal-opposition-2015
title: >-
  Leader-in-waiting Schumer broke with Obama and voted to advance Iran deal disapproval
date: 2015-08-06
category: foreign-policy
status: verified
summary: >
  On Aug. 6, 2015, Schumer, then the No. 3 Senate Democrat and expected next leader, announced he would
  oppose the Iran nuclear agreement and vote for a resolution of disapproval, the first senator from Obama's
  party to do so. On Sept. 10, 2015, he was one of four Democrats, with Cardin, Manchin and Menendez,
  to vote for cloture on the disapproval measure, which failed 58-42 and left the deal intact.
could_have: >
  As the party's incoming leader, Schumer could have supported the Democratic president's central diplomatic
  agreement, or abstained, rather than lending his stature to the Republican effort to block it.
context: >
  The AP reported Schumer signaled he would not lobby hard against the accord, and enough Democrats backed
  the deal to sustain it. Schumer said advocates on both sides had strong cases. This was a genuine policy
  disagreement, not a procedural failure.
schumer_response: >
  "After deep study, careful thought and considerable soul-searching, I have decided I must oppose the
  agreement," citing "the very real risk that Iran will not moderate" and inspections that were not "anywhere,
  anytime" (AP, Aug. 6, 2015).
