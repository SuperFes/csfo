slug: october-2018-judges-for-recess-deal
title: >-
  Days after Kavanaugh, Schumer traded 15 more judges, including 3 circuit seats, for recess
date: 2018-10-11
category: courts
status: verified
summary: >
  On Oct. 11, 2018, days after Kavanaugh's confirmation, Schumer and McConnell agreed to confirm a package
  of 15 judicial nominees (three circuit court, 12 district court) in one night and recess the Senate
  until after the Nov. 6 midterms. The deal ended a planned October session and gave senators about three
  weeks to campaign. NBC reported the Senate had confirmed 84 Trump judges by then, including 29 appellate
  judges.
could_have: >
  Schumer could have refused the package and forced Republicans to spend the scheduled October session
  processing each nominee, especially the three lifetime appellate seats.
context: >
  Democrats were defending 25 seats, 10 in states Trump won, so the recess helped them more than Republicans.
  The nominees likely would have been confirmed eventually given the GOP majority and the 2013 rules change.
schumer_response: >
  No on-record Schumer quote found. Sen. Mazie Hirono said, "Elections matter and I would like my colleagues
  to be able to go home" (CNN via WTVF).
