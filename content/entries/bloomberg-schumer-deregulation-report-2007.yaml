slug: bloomberg-schumer-deregulation-report-2007
title: >-
  Schumer co-commissioned a 2007 report warning Wall Street regulation was too heavy
date: 2007-01-22
category: economy-and-labor
status: verified
summary: >
  Eighteen months before the financial crisis, Schumer and Mayor Michael Bloomberg released a McKinsey
  report they commissioned, "Sustaining New York's and the US' Global Financial Services Leadership."
  It blamed the U.S. regulatory framework, including Sarbanes-Oxley, and the litigation climate for threatening
  New York's status, and urged the SEC to go further in easing rules. Its recommendations included faster
  Basel II implementation, limits on securities-litigation liability, and an optional federal charter
  for insurers.
could_have: >
  As a senior Banking Committee Democrat, Schumer could have used his platform to press for stronger oversight
  of the mortgage-backed securities and leverage risks then building on Wall Street, instead of putting
  his name to a competitiveness agenda centered on regulatory relief.
context: >
  The report drew bipartisan praise in New York, including from Gov. Eliot Spitzer, and did not call for
  repealing Sarbanes-Oxley itself; it said the problems lay with implementing rules. Financial services
  provided one in nine New York City jobs at the time, per the AP.
schumer_response: >
  Schumer said losing New York's status as the world's financial capital was "the last thing that New
  York and the country for that matter need" (AP, Jan. 22, 2007).
