slug: build-back-better-vote-promised-never-held
title: Expanded child tax credit lapses; promised Build Back Better vote never happens
date: 2021-12-31
category: economy-and-labor
status: verified
summary: >
  The expanded monthly child tax credit from the American Rescue Plan, paid to roughly 35 million families,
  expired at the end of 2021 after Build Back Better, which would have extended it, did not come up for
  a Senate vote; the last payment went out Dec. 15. On Dec. 20, 2021, the day after Manchin announced
  his opposition on Fox News Sunday, Schumer wrote that the Senate would consider the bill "very early
  in the new year." The Senate never held that vote; the reconciliation vehicle (H.R. 5376) next reached
  the floor in August 2022 as the much smaller Inflation Reduction Act.
could_have: >
  Schumer controlled whether the promised recorded vote happened. He could have held it as pledged, so
  that, in his words, every senator's position was on the floor record rather than only on television.
context: >
  In a 50-50 Senate the bill could not pass without Manchin, who cited cost and inflation, so a vote would
  have been a messaging vote rather than a path to passage. A standalone extension of the credit would
  have needed 60 votes.
schumer_response: >
  "The Senate will, in fact, consider the Build Back Better Act, very early in the new year so that every
  Member of this body has the opportunity to make their position known on the Senate floor, not just on
  television." (Dear Colleague letter quoted by NPR, Dec. 20, 2021).
