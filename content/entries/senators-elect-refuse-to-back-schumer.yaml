slug: senators-elect-refuse-to-back-schumer
title: Incoming Democratic senators say they will not back Schumer for leader
date: 2026-11-05
category: party-and-primaries
status: needs-review
summary: >
  Several Democratic senators-elect have said they will not support Schumer for majority leader. Sources
  agree on Adam Hamilton (Kan.), Troy Jackson (Maine) and Abdul El-Sayed (Mich.); The Hill adds Annie
  Andrews (S.C.), and Roll Call and Al Jazeera add Juliana Stratton (Ill.). Hamilton said, "I'm not supporting
  Schumer for leader." Al Jazeera counted at least seven freshmen who said or suggested they would not
  commit to Schumer, including Peggy Flanagan (Minn.), Chris Pappas (N.H.) and James Talarico (Texas).
could_have: >
  Hold an open process in which candidates for leader present a plan to the caucus, which several senators-elect
  and Sen. Chris Van Hollen have asked for.
context: >
  Five to seven defections are not enough on their own to deny Schumer a majority of a 54-56 member caucus
  (TIME). Sources differ on some names: TIME (Nov. 6) said Stratton, Flanagan, Pappas and Talarico had
  sidestepped the question, while Roll Call and Al Jazeera quote Flanagan saying "It is time for new leadership."
  AP reported Flanagan later said she was not ready to commit. Former Sen. Sherrod Brown, elected in Ohio,
  backs Schumer (AP).
schumer_response: >
  "The issue is focusing on the American people and what they want" (Roll Call). His office did not respond
  to Al Jazeera's questions.
