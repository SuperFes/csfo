slug: senators-elect-refuse-to-back-schumer
title: Democrats won the Senate, and incoming senators say they won't back Schumer
date: 2026-11-05
category: party-and-primaries
status: needs-review
review_note: >
  Still developing, and sources differ on some names, including Peggy Flanagan.
summary: >
  Democrats won Senate control in the Nov. 3, 2026 midterms, and several senators-elect have said they
  will not support Schumer for majority leader. Sources agree on Adam Hamilton (Kan.), Troy Jackson (Maine)
  and Abdul El-Sayed (Mich.); The Hill adds Annie Andrews (S.C.), and Roll Call and Al Jazeera add Juliana
  Stratton (Ill.). Hamilton said, "I'm not supporting Schumer for leader." Al Jazeera counted at least
  seven freshmen who said or suggested they would not commit to him. Sitting Sens. Chris Van Hollen and
  Elissa Slotkin have also declined to back him: Slotkin said she would not vote for him without a plan,
  and Van Hollen said there should be no "coronation." El-Sayed won his seat after defeating Schumer's
  preferred candidate in the Michigan primary.
could_have: >
  Open a contested leadership election in which candidates present a plan to the caucus, as several senators-elect
  and Van Hollen have asked for, or set out a transition timeline, rather than seeking another term by
  secret ballot with no declared opponent.
context: >
  Schumer needs only a simple majority of a caucus projected at 54 to 56 members, so five to seven defections
  are not enough on their own (TIME), and no senator has declared a challenge. The vote is expected in
  early December 2026. Sources differ on some names: TIME (Nov. 6) said Stratton, Peggy Flanagan (Minn.),
  Chris Pappas (N.H.) and James Talarico (Texas) had sidestepped the question, while Roll Call and Al
  Jazeera quote Flanagan saying "It is time for new leadership," and AP reported she later said she was
  not ready to commit. Allies, including Sen. Sheldon Whitehouse, credit his recruitment for putting red-state
  seats in play; Sen. Mark Kelly and Sherrod Brown, elected in Ohio, back him.
schumer_response: >
  "I'll be re-elected as majority leader," Schumer said, arguing the election was "not about" him: "This
  is about the American people and what they want and what they need" (Al Jazeera, Nov. 5, 2026). He told
  the New York Times, "Our caucus is focused on moving forward" (as reported by CNN).
