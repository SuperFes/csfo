slug: glass-steagall-repeal-vote-1999
title: >-
  Schumer voted for and championed the 1999 repeal of Glass-Steagall's core barriers
date: 1999-11-04
category: economy-and-labor
status: verified
summary: >
  In his first year in the Senate, Schumer voted yes on the conference report for S. 900, the Gramm-Leach-Bliley
  Act, which passed 90-8 and let banks, securities firms and insurers combine. Seven Democrats, including
  Boxer, Dorgan, Feingold, Harkin, Mikulski and Wellstone, voted no. On the floor Schumer called it "a
  historic moment," said "This bill is vital for the future of our country," and argued that without it
  "London or Frankfurt or, years down the road, Shanghai" could become the world's financial capital.
could_have: >
  Schumer could have joined the Democrats who voted no, or used his seat on the Banking Committee to push
  for firewalls between deposit-taking banks and securities trading as a condition of support.
context: >
  The bill passed by a lopsided bipartisan margin and President Clinton signed it, so Schumer's vote did
  not decide the outcome. In the same speech he said his goal was to "not take one step backward" on the
  Community Reinvestment Act and that he believed the bill was pro-consumer because it increased competition.
schumer_response: >
  On the Senate floor (Nov. 4, 1999) he argued the bill was needed to keep U.S. firms competitive and
  protect "hundreds of thousands—yes, millions—of high-paying jobs," adding that New York, "the financial
  capital of the world," had a particular stake.
