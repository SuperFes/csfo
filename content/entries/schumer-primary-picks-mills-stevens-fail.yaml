slug: schumer-primary-picks-mills-stevens-fail
title: Schumer's preferred candidates in Maine and Michigan lose to his critics
date: 2026-08-05
category: party-and-primaries
status: verified
summary: >
  Maine Gov. Janet Mills, backed by Schumer and the DSCC as their top recruit against Sen. Susan Collins,
  suspended her campaign on April 30, 2026; Graham Platner, who had called for Schumer's ouster as leader,
  won the June 9 primary. In Michigan, Rep. Haley Stevens, whom Schumer backed, lost the Aug. 4 primary
  to Abdul El-Sayed by about one point; El-Sayed had endorsed Chris Van Hollen for leader during his campaign
  (AP).
could_have: >
  Stay neutral in contested Democratic primaries instead of putting his and the DSCC's weight behind establishment
  candidates.
context: >
  Platner withdrew in July after a sexual assault allegation, which he denies; Maine Democrats replaced
  him with Troy Jackson, who won in November. Both seats ended up in Democratic hands, so the primary
  losses did not cost the party the general election.
schumer_response: >
  After Mills withdrew, Schumer and DSCC chair Kirsten Gillibrand said, "Our North Star is winning a Democratic
  Senate majority ... We have recruited strong candidates who have expanded the map" (NBC News). Asked
  about Platner, he said "we're going to beat Susan Collins and take back the Senate" (CBS News).
