slug: cares-act-millionaire-tax-break-2020
title: >-
  Schumer's CARES Act deal carried a tax break with 82% of benefits to millionaires
date: 2020-03-25
category: economy-and-labor
status: verified
summary: >
  Schumer negotiated the $2 trillion CARES Act with the Trump administration, and it passed the Senate
  96-0. A provision Senate Republicans put in the bill temporarily lifted a limit on how much pass-through
  business owners could deduct against nonbusiness income. The Joint Committee on Taxation later found
  that about 82 percent of its benefit would go to roughly 43,000 taxpayers earning over $1 million, at
  a cost of about $90 billion in 2020 alone.
could_have: >
  As the lead Democratic negotiator, Schumer could have demanded the provision be dropped or limited as
  a condition of Democratic votes, which Republicans needed to reach 60.
context: >
  The bill passed amid an emergency, and Democrats secured a $600-per-week unemployment boost, hospital
  and state funding, stock-buyback limits on bailout recipients and new oversight bodies. Democrats Whitehouse
  and Doggett, who requested the JCT analysis, later sought repeal.
schumer_response: >
  Schumer said Democrats "secured crucial worker protections throughout the bill" and "compelled the creation
  of Treasury Department Special Inspector General to provide oversight of Treasury loans" (floor remarks,
  March 25, 2020). No Schumer comment on the pass-through provision was found.
