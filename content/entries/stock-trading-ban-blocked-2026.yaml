slug: stock-trading-ban-blocked-2026
title: All Senate Democrats blocked the GOP stock-trading bill, calling it toothless
date: 2026-09-30
category: ethics-and-corruption
status: verified
summary: >
  On Sept. 30, 2026, the House-passed Stop Insider Trading Act failed 53-47 on a party-line vote, short
  of the 60 needed. Every Senate Democrat voted no. The bill would have barred members, spouses and dependent
  children from buying new individual stocks, but it did not require divestment of existing holdings.
  It also carried an unrelated photo-voter-ID requirement for federal elections. Democrats said they want
  a full ban that also covers the president and administration officials.
could_have: >
  Democrats could have offered and forced a vote on their own stronger ban, such as the bipartisan Restore
  Trust in Congress Act, or sought to strip the voter-ID provision and pass the trading restrictions on
  their own.
context: >
  Republicans attached the voter-ID provision, which Democrats called a "poison pill," and Democrats'
  objections to the bill's weakness were substantive: it allowed members to keep existing portfolios and
  exempted the White House. This vote is weak evidence that Schumer opposes a ban. The stronger criticism
  is the record from 2021 to 2024, when Democrats controlled the floor (see stock-trading-ban-punted-2022).
schumer_response: >
  "The Republican toothless stock-trading bill is as ineffective as a screen door on a submarine... They
  designed the bill to fail." He said Democrats are "ready to go" if Republicans want a full ban, and
  he criticized the bill for exempting the White House (CBS News).
