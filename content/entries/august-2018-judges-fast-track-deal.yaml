slug: august-2018-judges-fast-track-deal
title: >-
  Schumer fast-tracked 15 Trump district judges so senators could leave to campaign
date: 2018-08-28
category: courts
status: verified
summary: >
  On Aug. 28, 2018, Schumer and McConnell agreed to fast-track 15 of Trump's district court nominees,
  skipping up to 30 hours of debate on each, after McConnell had canceled most of the August recess. Seven
  were confirmed that day and eight the following week, so senators could go home to campaign. One, Charles
  Goodwin, had been rated "not qualified" by the American Bar Association. The deal came days before Brett
  Kavanaugh's Supreme Court hearings.
could_have: >
  Schumer could have refused unanimous consent and forced the full debate time on each nominee, consuming
  floor time McConnell needed ahead of the midterms and the Kavanaugh fight.
context: >
  Republicans had the votes to confirm these nominees eventually, and a senior Democratic aide said most
  had Democratic support. The 2013 rule change meant Democrats could delay but not block lower-court judges.
schumer_response: >
  No on-record Schumer quote; a senior Democratic aide told HuffPost the judges would have been confirmed
  eventually and most had Democratic support.
