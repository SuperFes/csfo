slug: filibuster-defense-2005
title: >-
  In 2005 Schumer said 51 votes was 'not the right vote' for major Senate decisions
date: 2005-05-23
category: filibuster-and-rules
status: verified
summary: >
  During the 2005 fight over Republican threats to end judicial filibusters, Schumer warned that the "nuclear
  option" would destroy the Senate's checks and balances. On May 23, 2005, after the "Gang of 14" deal,
  he told the Senate: "We must preserve the rights of the minority in the Senate. We must understand that
  a vote of 51 percent on the most major of decisions is not the right vote that is always called for."
  He added that requiring two-thirds to change the rules "is exactly to make it hard to change the rules."
could_have: >
  Not a missed action in itself; the record is relevant because it shows the institutional view of the
  filibuster Schumer held for years, which shaped what Democratic leadership was willing to do later when
  it held majorities.
context: >
  Schumer was in the minority defending a tool Democrats were using against President Bush's judicial
  nominees, and both parties' positions on the filibuster have tended to flip with majority status. Republicans
  have repeatedly quoted these remarks back at him.
schumer_response: >
  In the same speech he said the agreement "takes the nuclear option off the table" and preserved "the
  checks and balances that are the hallmark of this institution."
