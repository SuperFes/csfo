slug: wall-street-fundraising-record
title: Schumer took nearly $9 million from the securities industry over two decades
date: 2011-06-29
category: ethics-and-corruption
status: verified
summary: >
  Citing the Center for Responsive Politics (OpenSecrets), CBS News reported in 2011 that Schumer had
  taken in nearly $9 million from the securities and investment industry between 1989 and 2010, including
  about half a million dollars from Goldman Sachs and nearly as much each from Citigroup, Morgan Stanley
  and JPMorgan Chase. As DSCC chairman for the 2006 and 2008 cycles, he relied heavily on lower-Manhattan
  donors to outraise Republicans, Roll Call reported. CBS also noted a New York Times finding that Schumer
  had repeatedly shielded the financial industry from oversight.
could_have: >
  A leader seeking distance from the industry he oversaw on the Banking and Finance committees could have
  limited reliance on securities-industry money, especially while chairing the party's Senate fundraising
  arm.
context: >
  Schumer represented the state that houses Wall Street, so heavy industry giving is unsurprising. He
  also backed Dodd-Frank in 2010, which Roll Call reported angered many of his financial-industry backers,
  and CBS noted he pushed the SEC on high-frequency trading and fought GOP cuts to SEC funding.
schumer_response: >
  Schumer told Bloomberg News in 2009: "When Wall Street comes in conflict with Main Street, I tend to
  side with Main Street" (quoted by CBS News). In 2010 he told Roll Call, "I believe that there were significant
  excesses in the financial services industry that led to the crisis."
