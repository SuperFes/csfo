slug: maine-mills-recruitment-collapse
title: >-
  Schumer's hand-picked Maine recruit quit before the primary, outspent and outpolled
date: 2026-04-30
category: party-and-primaries
status: verified
summary: >
  Schumer spent more than a year recruiting Maine Gov. Janet Mills, then 78, to challenge Sen. Susan Collins,
  and the DSCC formed a joint fundraising committee with her the day she launched in October 2025. Mills
  trailed insurgent Graham Platner badly. A February 2026 poll had Platner up 64% to 26%, and Platner
  raised more than $12 million to Mills' roughly $1 million on hand entering April. She suspended her
  campaign on April 30, 2026, saying she lacked "the financial resources" to continue. Platner won the
  June 9 primary with about 78% of the vote even though Mills had dropped out.
could_have: >
  Leadership could have stayed neutral in a contested primary, as Senate Democrats reportedly urged after
  the polling turned, or shifted early to whichever candidate Maine voters were choosing, rather than
  spending national party resources and credibility on a 78-year-old recruit.
context: >
  Recruiting a sitting governor has historically been a strong Senate strategy, and Schumer's allies said
  heavier intervention late in the race would have been controversial and might not have saved her. Platner
  later withdrew in July 2026 after a sexual-assault allegation, which he denied. Maine Democrats nominated
  former state Senate President Troy Jackson at a convention, and Jackson defeated Collins on Nov. 3,
  2026. Platner had said he would not back Schumer as leader. Jackson has said the same and named Bernie
  Sanders as his preference.
schumer_response: >
  After Mills withdrew, Schumer praised her "hard-fought and principled campaign." He and DSCC Chair Kirsten
  Gillibrand said their "North Star is winning a Democratic Senate majority" and pledged to work with
  Platner. A Schumer spokesperson had earlier said his "North Star is taking back the Senate" (AP, March
  31, 2026).
