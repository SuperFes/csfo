slug: aoc-2028-primary-threat
title: Polling shows Ocasio-Cortez leading Schumer in a possible 2028 primary
date: 2025-04-04
category: party-and-primaries
status: needs-review
review_note: >
  The only head-to-head poll is from Data for Progress, a progressive firm, in March 2025. Ocasio-Cortez has not said whether she will run.
summary: >
  A Data for Progress poll of 767 likely New York Democratic primary voters (March 26-31, 2025) found
  Rep. Alexandria Ocasio-Cortez leading Schumer 55% to 36% in a hypothetical 2028 Senate primary. Schumer
  is up for reelection in 2028. On Nov. 10, 2026, Ocasio-Cortez declined to say whether she backs Schumer
  for leader ("that's up to their decision") and declined to discuss a 2028 primary.
could_have: >
  Clarify whether he will seek another Senate term, which would shape both the 2028 race and the leadership
  succession.
context: >
  Data for Progress is a progressive firm, and a poll this far ahead of a primary is not predictive. Ocasio-Cortez
  has not announced a Senate run and has been mentioned as a possible 2028 presidential candidate (TIME).
schumer_response: null
