slug: durbin-votes-for-trump-district-judges
title: Judiciary's top Democrat kept voting to confirm Trump district judges most Democrats opposed
date: 2026-07-23
people: [dick-durbin]
category: courts
status: verified
summary: >
  As ranking member of the Judiciary Committee, Durbin voted to confirm Trump district-court nominees while
  most of his caucus voted no. These include Harold Mooty III in Alabama (Oct. 21, 2025, one of 14
  Democratic-caucus yes votes, confirmed 66-32), Bill Lewis in Alabama (Oct. 27, one of 6, 58-40), Matthew
  Orso in North Carolina (Dec. 3, one of 5, 57-41), David Clay Fowlkes in Arkansas (Feb. 3, 2026, one of 5,
  54-40) and Antonio Pozos in Pennsylvania (July 23, 2026, 49-44). On Pozos, only Durbin and Sen. John
  Fetterman voted yes. These are lifetime appointments, and none of the seats is in Illinois. Demand
  Justice said of the Mooty vote, "It's wrong, and it must end."
could_have: >
  Durbin could have voted no along with the majority of Senate Democrats on each nomination.
context: >
  None of these votes decided an outcome. Sen. Amy Klobuchar also voted for Mooty. In July 2026, Durbin and
  two other Judiciary Democrats voted to advance Michigan nominee Michael Martin, whom Michigan's Democratic
  senators had endorsed (Bloomberg Law). Durbin is retiring when his term ends in January 2027.
