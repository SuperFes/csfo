slug: carried-interest-loophole-survives
title: The carried-interest break for fund managers survived Schumer for 15 years
date: 2022-08-05
category: economy-and-labor
status: verified
summary: >
  Carried interest lets private-equity and hedge-fund managers pay capital-gains rates on their pay. In
  2007, as House Democrats and a bipartisan Senate Finance proposal moved to tax it as ordinary income,
  Schumer, then DSCC chairman, opposed the targeted measures as unfairly singling out an industry important
  to his constituents and said any change should also cover real estate, venture capital and energy partnerships.
  Critics called that a "poison pill," and ProPublica and opponents of the break said the broadening increased
  resistance and helped stall reform for years. In August 2022 the Inflation Reduction Act's carried-interest
  provision, worth about $14 billion over a decade, was dropped to win Sen. Kyrsten Sinema's vote, and
  a 1% tax on stock buybacks was added in its place.
could_have: >
  In 2007 Schumer could have backed the narrower proposals already on the table instead of conditioning
  support on a broader version with a weaker chance of passage. In 2021 and 2022 leadership could have
  made the provision a priority in earlier reconciliation talks, or forced a standalone recorded vote.
context: >
  In 2022 the decisive actor was Sinema, who refused to let the bill proceed unless the provision came
  out. She had received at least $2 million from the securities and investment industry since 2018, per
  CNBC. Schumer said he personally pushed to include it. In 2007 other Democrats, including Chris Dodd,
  also hesitated, and an opinion column noted heavy giving to the DSCC from private equity and hedge fund
  employees at the time; no quid pro quo has been established. His backers argue that taxing all carried
  interest as ordinary income was the more principled position.
schumer_response: >
  In 2007 his spokesman said the broader approach was "broader, fairer and will raise more revenue than
  targeting only publicly traded partnerships" (Bloomberg via InvestmentNews). In 2022: "I pushed for
  it to be in this bill... Senator Sinema said she would not vote for the bill, not even move to proceed
  unless we took it out. So we had no choice" (Aug. 5, 2022).
