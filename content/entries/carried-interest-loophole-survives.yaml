slug: carried-interest-loophole-survives
title: The carried-interest break for fund managers survived Schumer's majority again
date: 2022-08-05
category: economy-and-labor
status: verified
summary: >
  The carried-interest provision in the Inflation Reduction Act would have narrowed a tax break that lets
  private-equity and hedge-fund managers pay capital-gains rates on their pay. It would have raised about
  $14 billion over a decade. It was dropped in August 2022 to win Sen. Kyrsten Sinema's vote, and a 1%
  tax on stock buybacks was added in its place. This followed a longer pattern. In 2007, Schumer insisted
  that any carried-interest change also cover real estate, venture capital and other sectors, a broadening
  that ProPublica and opponents of the break said increased resistance and helped stall reform for years.
  Schumer's top donor sectors have been finance and real estate.
could_have: >
  In 2007 Schumer could have backed the narrower House proposal aimed at fund managers instead of demanding
  a broader version. In 2021 and 2022 leadership could have made the provision a priority in earlier reconciliation
  talks, or forced a standalone recorded vote.
context: >
  In 2022 the decisive actor was Sinema, who refused to let the bill proceed unless the provision came
  out. She had received at least $2 million from the securities and investment industry since 2018, per
  CNBC. Schumer said he personally pushed to include it. His backers argue that taxing all carried interest
  as ordinary income, including real estate, was the more principled position.
schumer_response: >
  "I pushed for it to be in this bill... Senator Sinema said she would not vote for the bill, not even
  move to proceed unless we took it out. So we had no choice" (Aug. 5, 2022).
