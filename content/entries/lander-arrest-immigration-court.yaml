slug: lander-arrest-immigration-court
title: ICE arrests NYC Comptroller Brad Lander at immigration court; no charges filed
date: 2025-06-17
category: oversight-and-accountability
status: needs-review
summary: >
  On June 17, 2025, federal agents arrested New York City Comptroller and mayoral candidate Brad Lander
  at the immigration court in 26 Federal Plaza after he linked arms with a man being detained. DHS accused
  him of "assaulting law enforcement and impeding a federal officer." He was released the same day after
  about 3.5 hours, and no charges were filed. Semafor reported that Schumer accused the administration
  of "weaponizing law enforcement to attack political enemies." No Senate action followed.
could_have: >
  Schumer could have written to DHS and SDNY demanding the basis for the arrest, or made answers a condition
  for moving DHS or DOJ nominees. As New York's senior senator, he could also have used his blue-slip
  and consultation role on New York U.S. attorney nominees.
context: >
  Lander was never charged, and NBC reported that SDNY said it was still investigating. The arrest came
  days after the Padilla incident, and Senate Democrats' formal responses that month centered on Padilla.
  Reason for needs-review: Schumer's quote comes from Semafor alone, and the full statement was not found.
schumer_response: >
  Semafor reported that Schumer accused the Trump administration of "weaponizing law enforcement to attack
  political enemies." The full statement was not located.
response_level: statement
