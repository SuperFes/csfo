slug: six-lawmakers-illegal-orders-grand-jury
title: >-
  DOJ seeks indictments of 2 senators and 4 House Democrats over a video; grand jury refuses
date: 2026-02-10
category: oversight-and-accountability
status: verified
summary: >
  On Feb. 10, 2026, a federal grand jury in Washington, D.C., declined to indict Sens. Mark Kelly and
  Elissa Slotkin and Reps. Jason Crow, Chrissy Houlahan, Maggie Goodlander and Chris Deluzio. U.S. Attorney
  Jeanine Pirro's office had sought charges under 18 U.S.C. § 2387 over a video in which the six urged
  service members to refuse illegal orders. CBS reported the vote against indictment was unanimous, and
  Pirro later dropped the effort. Separately, Defense Secretary Hegseth censured Kelly on Jan. 5, 2026
  and moved to cut his retired rank; Kelly sued.
could_have: >
  With two of his own senators targeted, Schumer could have put a caucus-wide hold on DOJ and DoD nominees,
  conditioned DOJ appropriations, or forced a floor vote on a resolution condemning the prosecution of
  members for speech. His floor remarks called on senators to "take a stand" but committed the caucus
  to no concrete step.
context: >
  Schumer spoke forcefully here, unlike his silence on Omar. The grand jury, not Senate action, stopped
  the case. A watchdog group later filed bar complaints against Pirro.
schumer_response: >
  Floor remarks on Feb. 12, 2026: "The President of the United States tried to throw two US Senators in
  jail," "It's a constitutional crisis of the highest order," and "It should not, cannot, must not happen
  here in America." He announced no holds, legislation or oversight steps.
response_level: statement
tags:
- retaliation
