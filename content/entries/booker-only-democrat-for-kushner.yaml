slug: booker-only-democrat-for-kushner
title: Booker was the only Democrat to confirm Charles Kushner, a Trump pardon recipient, as ambassador to France
date: 2025-05-19
people: [cory-booker]
category: ethics-and-corruption
status: verified
summary: >
  On May 19, 2025, the Senate confirmed Charles Kushner, Jared Kushner's father, as ambassador to France,
  51-45. Booker was the only Democrat to vote yes. Kushner was sentenced in 2005 to two years in prison after
  pleading guilty to 18 counts, including tax evasion and witness tampering, and Trump pardoned him in
  December 2020 (AP). In his confirmation testimony, Kushner thanked Booker for his "special and close
  friendship."
could_have: >
  Booker could have voted no with every other Democratic senator who voted.
context: >
  His vote did not decide the outcome. Booker credited Kushner's work on criminal justice reform.
statement: >
  Booker said, "I supported his confirmation because he has been unrelenting in reforming our criminal
  justice system" (The Daily Beast, via TheGrio).
