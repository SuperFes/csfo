slug: house-leaders-present-on-trump-impeachment
title: House Democratic leaders voted "present" as most of their caucus tried to keep Trump impeachment alive
date: 2026-09-15
people: [hakeem-jeffries, katherine-clark, pete-aguilar]
category: oversight-and-accountability
status: verified
summary: >
  Rep. Al Green forced three House votes on impeaching President Trump, and each time Republicans moved to
  table, or kill, the resolution. On the first, on June 24, 2025, Jeffries, Clark and Aguilar voted to table
  it along with 128 other Democrats, while 79 Democrats voted no. On Dec. 11, 2025, the three leaders voted
  "present"; 140 Democrats voted against tabling, and the resolution was shelved 237-140 with 47 Democrats
  voting present. On Sept. 15, 2026, Green's third resolution cited Operation Metro Surge, including the
  killings of Alex Pretti and Renee Good in Minneapolis. The leaders voted present again while 147 Democrats
  voted no, and it was tabled 232-147.
could_have: >
  The leaders could have voted against tabling, as a majority of House Democrats did on the last two votes,
  rather than sitting out the question while their caucus went on record.
context: >
  Republicans had the votes to table each resolution without Democratic help. The leaders said impeachment
  "traditionally requires a comprehensive investigative process" and that "None of that serious work has been
  done" by the Republican majority. In September 2026 they committed to "holding the crooks accountable using
  every tool available to us beginning on day one" (Deseret News). Democrats won the House in November 2026,
  and Jeffries is the caucus nominee for speaker.
statement: >
  In a joint statement before the December 2025 vote, the three leaders said, "Accordingly, we will be voting
  'present' on today's motion to table the impeachment resolution," as they "continue our fight to make life
  more affordable for everyday Americans."
