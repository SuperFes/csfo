slug: blue-collar-democrats-quote-2016
title: >-
  Schumer predicted suburban Republicans would offset lost blue-collar Democrats in 2016
date: 2016-07-30
category: party-and-primaries
status: needs-review
summary: >
  During the 2016 campaign, Schumer was quoted saying, "For every blue-collar Democrat we will lose in
  western Pennsylvania, we will pick up two or three moderate Republicans in the suburbs of Philadelphia."
  Trump carried Pennsylvania that November, and Democrats lost the Pennsylvania Senate race. Schumer became
  Democratic leader days after the election.
could_have: >
  As the party's incoming Senate leader, Schumer could have pushed a strategy that competed for working-class
  voters in the industrial Midwest rather than treating their losses as an acceptable trade.
context: >
  The remark was offered as analysis of why Republicans would struggle in Pennsylvania, not as a formal
  strategy document. After the election Schumer said he hoped Democrats could "speak to the blue-collar
  worker." Exact wording varies across sources ("two" vs. "two or three").
schumer_response: null
