slug: supreme-court-ethics-bill-no-floor-vote
title: >-
  Supreme Court ethics bill clears committee after Thomas revelations, gets no floor vote
date: 2023-07-20
category: courts
status: verified
summary: >
  After ProPublica reported undisclosed gifts and travel to Justice Clarence Thomas from GOP donor Harlan
  Crow, the Senate Judiciary Committee advanced S. 359, the Supreme Court Ethics, Recusal, and Transparency
  Act, 11-10 on party lines on July 20, 2023. Leadership never filed cloture to force a recorded floor
  vote; the only floor attempt was a June 12, 2024 unanimous-consent request by Judiciary Chair Dick Durbin,
  which Sen. Lindsey Graham blocked. That same summer, leadership did schedule cloture votes on contraception
  (June 5), IVF (June 13 and Sept. 17) and reproductive-care (July 10) bills that were also expected to
  fail.
could_have: >
  Schumer could have filed cloture on S. 359 to put every senator on record, as he did for other priority
  bills in 2024 that lacked 60 votes.
context: >
  Every Republican on the committee voted no, Graham said it would "go nowhere," and the GOP House opposed
  it, so the bill had no path to 60 votes or enactment. A floor vote would have been a messaging vote.
schumer_response: >
  In July 2023 Schumer said "It's time for the highest court in the land to be held to the highest ethical
  standards" and that he looked forward to making progress (CBS). In August 2024 he told NBC court reform
  would be "a very big priority" if Democrats won the 2024 elections.
