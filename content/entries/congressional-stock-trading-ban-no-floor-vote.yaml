slug: congressional-stock-trading-ban-no-floor-vote
title: Congressional stock-trading ban clears committee, never gets a Senate floor vote
date: 2024-07-24
category: ethics-and-corruption
status: verified
summary: >
  On July 24, 2024, the Senate Homeland Security and Governmental Affairs Committee approved a revamped
  ETHICS Act (S. 1171), a bipartisan Peters-Hawley-Ossoff-Merkley ban on stock trading by members of Congress,
  the president and vice president, 8-4 — the first such ban to clear a Senate committee. It was placed
  on the Senate calendar on Dec. 19, 2024 and never received a floor vote before the 118th Congress ended.
  Ossoff had first introduced a ban in 2021. In September 2024, more than 40 former members and officials
  asked Schumer and McConnell for a floor vote or a must-pass vehicle.
could_have: >
  The majority leader could have filed cloture on S. 1171 to force a recorded vote, or attached it to
  a year-end must-pass bill as the former members requested.
context: >
  The bill needed 60 votes and Republican leadership was not backing it; Roll Call wrote that lack of
  leadership buy-in had repeatedly grounded the effort. The House had also not acted.
schumer_response: >
  Roll Call reported that Schumer endorsed the idea in 2022 "but has said little publicly on the subject
  since"; his office did not respond to requests for comment on the markup or the floor-vote letter.
