slug: carried-interest-opposition-2007
title: >-
  Schumer resisted a tax hike on hedge fund and private equity managers' carried interest
date: 2007-07-30
category: economy-and-labor
status: needs-review
summary: >
  In 2007, as House Democrats and a bipartisan Senate Finance proposal moved to tax private equity and
  hedge fund managers' "carried interest" at ordinary income rates instead of 15 percent, Schumer, then
  DSCC chairman and the only Democrat on both committees with jurisdiction, opposed the targeted measures,
  saying they unfairly singled out an industry important to his constituents. In August 2007 his office
  said he would instead push a broader carried-interest increase covering real estate, venture capital
  and energy partnerships, an approach critics called a "poison pill." The carried interest preference
  was not repealed.
could_have: >
  As a key Democrat on Finance and Banking, Schumer could have backed the narrower bills already on the
  table rather than conditioning support on a broader version with a weaker chance of passage.
context: >
  Schumer's office argued the broader approach was "broader, fairer and will raise more revenue." Other
  Democrats, including Chris Dodd, also hesitated. During the same period private equity and hedge fund
  employees were giving heavily to the DSCC Schumer chaired; that donation pattern is reported in an opinion
  column, not established as a quid pro quo.
schumer_response: >
  Spokesman Brian Fallon told Reuters the broader approach was "broader, fairer and will raise more revenue
  than targeting only publicly traded partnerships" (Bloomberg via InvestmentNews, Aug. 2007).
