slug: march-2025-backlash-calls-to-step-down
title: Pelosi, House Democrats and Indivisible rebuke Schumer; first calls to step down
date: 2025-03-15
category: party-and-primaries
status: verified
summary: >
  On March 14, 2025, Nancy Pelosi said the bill presented "a false choice" and praised Hakeem Jeffries
  for rejecting it; Rep. Alexandria Ocasio-Cortez described a "deep sense of outrage and betrayal." On
  March 15, Indivisible called on Schumer to step down as Democratic leader. On March 18, Rep. Glenn Ivey
  (D-Md.) said "it may be time for Senate Democrats to choose a new leader," and Rep. Delia Ramirez (D-Ill.)
  answered "Yes" when asked if Schumer should be replaced.
could_have: >
  Announce a leadership timeline or a caucus review of the strategy rather than rejecting calls to step
  aside outright.
context: >
  No Democratic senator publicly called for him to step down at the time. Asked whether the Senate needed
  new leadership, Jeffries said only "Next question" (NPR).
schumer_response: >
  On ABC's "The View" (March 18) he said he "knew it was a difficult choice" but "felt as a leader I had
  to do it," and said he should remain leader. To reporters he said, "I'm the best leader for the Senate"
  and "No, no ... We're moving forward" (NewsNation).
