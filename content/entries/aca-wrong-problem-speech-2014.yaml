slug: aca-wrong-problem-speech-2014
title: >-
  Schumer said Democrats put their 2009 mandate into 'the wrong problem' with the ACA
date: 2014-11-25
category: other
status: verified
summary: >
  Three weeks after Democrats lost the Senate in 2014, Schumer, then the No. 3 Senate Democrat, said at
  the National Press Club that "Democrats blew the opportunity the American people gave them" and that
  "We took their mandate and put all of our focus on the wrong problem — health care reform." He said
  the law should have come only after Democrats "first proposed and passed bold programs" for the middle
  class.
could_have: >
  If Schumer believed the sequencing was wrong in 2009, he was part of the leadership team that set the
  agenda and could have fought for a different priority then, instead of publicly second-guessing the
  party's signature law after an election loss.
context: >
  Schumer voted for the ACA and said he still supported it: "We should have done it. We just shouldn't
  have done it first." He said he had voiced concerns at the time about moving "full steam ahead" and
  was overruled.
schumer_response: >
  Schumer said health reform "wasn't the change we were hired to make" and that he had raised timing concerns
  in 2009 (Roll Call; Christian Science Monitor).
