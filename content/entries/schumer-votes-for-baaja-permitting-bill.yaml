slug: schumer-votes-for-baaja-permitting-bill
title: Schumer and 14 other Democratic-caucus senators help pass a permitting bill that weakens environmental laws
date: 2026-11-19
people: [chuck-schumer, amy-klobuchar, brian-schatz, chris-coons, angus-king]
category: other
status: verified
summary: >
  On Nov. 19, the Senate passed the Bipartisan American Affordability and Jobs Act (BAAJA) 62-33, with
  Schumer and 14 other senators who caucus with Democrats voting yes. The bill would weaken the Clean Water
  Act, the Endangered Species Act and other environmental laws to speed approval of energy projects, including
  gas pipelines and data centers. It would limit federal courts' power to block projects over environmental
  violations, exempt pipeline expansions from NEPA review, restrict states' and tribes' ability to block
  projects under the Clean Water Act, and potentially bar future administrations from rolling back approved
  projects (Common Dreams). It passed without a Senate hearing.
could_have: >
  Voted no with Durbin, Booker, Van Hollen and the other Democratic-caucus senators who did, and sent the
  bill back for hearings in the new Congress.
context: >
  On Nov. 9, 22 Democratic-caucus senators, Schumer among them, voted to advance the bill, 73-25 (Common
  Dreams). Seven of them, Blumenthal, Cortez Masto, Gillibrand, Kim, Ossoff, Shaheen and Warnock, voted no
  on final passage; Kim said the improvements that "would rein in the worst impulses of the Trump
  administration, were not made." The final Democratic yes votes were Coons, Fetterman, Gallego, Heinrich,
  Hickenlooper, King, Klobuchar, Peters, Reed, Rosen, Schatz, Schumer, Slotkin, Warner and Whitehouse, a lead
  sponsor alongside Mike Lee (R-Utah). Republicans Hawley and Rounds voted no. The American Petroleum
  Institute and the White House back the bill, and some green groups supported its transmission provisions.
  It still needs to pass the House. Friends of the Earth president Erich Pica said, "It's unconscionable that
  Democrats helped them do it."
