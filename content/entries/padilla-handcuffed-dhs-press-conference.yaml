slug: padilla-handcuffed-dhs-press-conference
title: >-
  Sen. Padilla forced to the ground and handcuffed at Noem event; Democrats send a letter
date: 2025-06-12
category: oversight-and-accountability
status: verified
summary: >
  On June 12, 2025, federal agents forcibly removed Sen. Alex Padilla (D-Calif.) from a DHS press conference
  in Los Angeles held by Secretary Kristi Noem. He was pushed to the floor and handcuffed while saying
  "I am Senator Alex Padilla. I have questions for the secretary." He was not detained. DHS said agents
  thought he was an attacker and that he ignored commands to step back. Senate Democrats responded with
  floor speeches, demands for Noem's testimony or resignation, and on June 24 a letter from the whole
  caucus, led by Schumer, asking Noem for "a full and transparent report."
could_have: >
  Senate Democratic leadership could have holds on DHS nominees, objections to unanimous consent on DHS
  business, or conditions on DHS appropriations until the department produced the report and body-camera
  footage. The caucus letter set no deadline and threatened no consequence.
context: >
  Schumer did respond quickly and in public. He spoke on the floor the same day, called for an investigation,
  asked Republican Leader Thune for a bipartisan Senate inquiry, and led the caucus letter. Senate Judiciary
  Democrats separately asked Chairman Grassley to have Noem testify. In the minority, Democrats could
  not compel testimony or hold hearings themselves.
schumer_response: >
  On the Senate floor: "I just saw something that sickened my stomach; the manhandling of a United States
  Senator." CBS reported he wanted answers "to what the hell went on." He asked Thune for a bipartisan
  investigation and led the June 24, 2025 caucus letter to Noem.
response_level: letter
tags:
- retaliation
