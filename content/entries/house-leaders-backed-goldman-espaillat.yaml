slug: house-leaders-backed-goldman-espaillat
title: House Democratic leaders backed Goldman, and Jeffries backed Espaillat; both lost primaries to insurgents
date: 2026-06-23
people: [hakeem-jeffries, katherine-clark, pete-aguilar]
category: party-and-primaries
status: verified
summary: >
  On Jan. 6, 2026, Jeffries, Clark and Aguilar endorsed Rep. Dan Goldman's reelection bid in New York's 10th
  District as he faced a primary challenge from Brad Lander (Punchbowl News). Jeffries said, "Rep. Goldman's
  strong leadership skills are needed in Washington as we protect our democracy and defend the rule of law."
  Lander, endorsed by Mayor Zohran Mamdani and Sens. Bernie Sanders and Elizabeth Warren, led Goldman 62% to
  38% when AP called the race on June 23. Jeffries had also backed Rep. Adriano Espaillat in the 13th
  District, who trailed organizer Darializa Avila Chevalier 49% to 46% when AP called that race for her
  (Roll Call).
could_have: >
  The leaders could have stayed out of contested primaries in New York and left the choice to Democratic
  voters, rather than putting the House leadership behind incumbents those voters rejected.
context: >
  Party leaders commonly back incumbents in primaries. Gov. Kathy Hochul also endorsed Goldman.
