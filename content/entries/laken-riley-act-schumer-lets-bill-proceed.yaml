slug: laken-riley-act-schumer-lets-bill-proceed
title: >-
  Schumer votes to open debate on Laken Riley Act, which then passes with 12 Democrats
date: 2025-01-20
category: immigration
status: verified
summary: >
  On January 9, 2025, the Senate voted 84-9 to invoke cloture on proceeding to the Laken Riley Act, and
  on January 13 it agreed 82-10 to the motion to proceed, with Schumer voting yes both times. The bill
  skipped committee markup. On January 20 it passed 64-35, with 12 Democrats voting yes; Schumer voted
  no on final passage. Several Democratic senators, including Bennet, Kaine and Welch, afterward criticized
  how the process was handled.
could_have: >
  Hold the caucus against the motion to proceed until Republicans agreed to committee consideration or
  a guaranteed set of amendment votes, rather than granting procedural votes first and hoping to amend
  the bill later.
context: >
  Schumer opposed the bill on final passage, and the 12 Democrats who voted yes, many of them from swing
  states, had signaled support early. Leaders cannot force members' votes. Per The Hill, an anonymous
  Democratic senator complained that leadership had effectively conceded the issue.
schumer_response: >
  Before the January 9 vote he said, "If we get on the bill, Democrats want to have a robust debate where
  we can offer amendments and improve the bill" (Roll Call). He later downplayed the caucus clash, describing
  a long lunch debate as a discussion of "all the great issues" (The Hill).
