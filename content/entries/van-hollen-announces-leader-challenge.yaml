slug: van-hollen-announces-leader-challenge
title: Van Hollen announces challenge to Schumer for majority leader
date: 2026-11-12
category: party-and-primaries
status: needs-review
review_note: >
  Still developing. Newsweek reports the leadership election is set for Dec. 1.
summary: >
  On Nov. 12, 2026, Sen. Chris Van Hollen announced he will run for Senate majority leader, the first
  senator to formally challenge Schumer for the post. "In this election, the American people called for
  change," he said in a statement, "a change from the status quo that isn't working for working people.
  It's now on us to meet this moment, and to do that we need new leadership. This is not about any one
  person." His team said he will run on using every available tool to end the Iran war, starting with the
  upcoming government funding measure, reversing Trump's "big, beautiful bill," getting money out of
  politics and tackling corruption (NBC News).
could_have: >
  Commit to an open, contested leadership race in which each candidate lays out a concrete plan to the
  caucus, as Sen. Slotkin has asked for, rather than declaring he already has the votes.
context: >
  Two days earlier, Sen. Bernie Sanders said he would not support Schumer, and Sen. Elissa Slotkin said she
  was a "no" until she saw a concrete plan. NBC reported that grassroots progressives and some newly
  elected Democratic senators had tried to draft Van Hollen. Democratic senators will choose their leaders
  for the next Congress by secret ballot, which Newsweek reports is set for Dec. 1; a simple majority of the
  caucus is needed to win. NBC's reporters assessed that Schumer remains favored to keep the job. After the
  announcement, Sanders and Michigan Sen.-elect Abdul El-Sayed endorsed Van Hollen on X. Van Hollen told MS
  NOW that more than 10 senators had pledged to support him, though a tally by The 29th Vote counted two
  public commitments for him and 13 for Schumer (Newsweek). On Nov. 13, the Working Families Party urged
  Schumer not to seek another term as leader and endorsed Van Hollen, and Slotkin repeated that she will
  not support Schumer, without saying she would back Van Hollen. A Drop Site News count that day had 16
  senators for Schumer, eight backing or leaning toward Van Hollen and 31 undecided or unstated (Common
  Dreams). Sen. Jeff Merkley endorsed Van Hollen, saying "politics as usual is unacceptable" (AP), and so
  did Sen.-elect Peggy Flanagan (ABC News). The Machinists union formally endorsed him (IAM), and the
  Office and Professional Employees union, with more than 90,000 members, asked Schumer not to seek the
  post (The New Republic). Sen. Brian Schatz, running unopposed for whip, endorsed Schumer (Punchbowl
  News). By Nov. 15 more than a dozen senators had publicly backed Schumer, including Sheldon Whitehouse,
  Tammy Baldwin, Mark Kelly and Kirsten Gillibrand (The Hill) and Ruben Gallego and Angela Alsobrooks
  (Politico). Van Hollen was claiming "about 15 and growing," while Schumer, who has not released a whip
  list, maintains he has the votes (Politico). On CNN, Van Hollen said, "I don't think it's the role of
  the Senate majority leader to get involved in open, contested Democratic primaries. I have two
  colleagues right now in the Senate, senators-elect, who would not be there if the current majority
  leader had his way. He joined with AIPAC and crypto to try to defeat them." He did not name them
  (RealClearPolitics transcript). He first made the charge on Nov. 10, saying Schumer and the DSCC "sided
  with the crypto industry and AIPAC against these candidates" (MS NOW). In Michigan, Schumer publicly
  backed Haley Stevens over Abdul El-Sayed (Punchbowl News), and AIPAC and its affiliates spent close to
  $30 million for her (AP). The Follow the Crypto tracker records no crypto-PAC spending in the Michigan,
  Minnesota or Maine Democratic primaries. Sen. John Fetterman said "it would
  be troubling if my caucus elects someone like Van Hollen," whom he called "very…hostile to Israel"
  (Newsweek).
schumer_response: >
  "I welcome any discussion about the future of our caucus and the important work ahead. I'm proud of what
  we've accomplished together—55 seats and counting is an amazing result—and I have the votes to continue
  serving as Democratic Leader. I look forward to leading our new Democratic majority and delivering for
  the American people" (on X).
