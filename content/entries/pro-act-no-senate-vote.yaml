slug: pro-act-no-senate-vote
title: >-
  House passes the PRO Act; Senate never votes on it in four years of Democratic control
date: 2021-03-09
category: economy-and-labor
status: needs-review
summary: >
  The House passed the PRO Act, the most significant pro-union labor-law overhaul in decades, 225-206
  on March 9, 2021. The Intercept reported that Schumer told AFL-CIO President Richard Trumka the Senate
  would vote on it once it had 50 cosponsors. In April 2021 it had 46, with Sinema, Kelly, Warner and
  King not signed on. Senate roll-call records for 2021-2024 show no vote on the bill.
could_have: >
  Leadership could have held a recorded cloture vote without waiting for 50 cosponsors, as it did with
  other bills that lacked 60 votes (voting rights, abortion rights).
context: >
  No Republican support was expected, so passage required eliminating the filibuster, which Manchin and
  Sinema opposed; the bill did not even have 50 Democratic cosponsors.
schumer_response: >
  Per The Intercept, Schumer set 50 cosponsors as the threshold for a floor vote. No on-record Schumer
  statement was located.
