slug: bank-deregulation-bill-2018
title: Schumer let 16 Democrats help pass the 2018 Dodd-Frank rollback without a fight
date: 2018-03-14
category: economy-and-labor
status: verified
summary: >
  The Senate passed S. 2155, the Economic Growth, Regulatory Relief, and Consumer Protection Act, 67-31,
  with 16 Democrats and Angus King joining every Republican. The bill raised the threshold for enhanced
  Federal Reserve oversight of banks. Schumer voted no, but the AP reported he said he would not try to
  stop the bill, let Democrats negotiate it with Banking Committee Republicans, and largely stepped aside.
could_have: >
  As minority leader, Schumer could have whipped against the bill or set a caucus position; with 31 no
  votes, flipping eight of the Democratic yes votes would have left it short of the 60 needed to overcome
  a filibuster.
context: >
  Many of the Democratic yes votes came from senators up for reelection in 2018 in states Trump won, and
  Schumer's approach aimed to protect them. A former Reid aide said "a good leader knows there are different
  ways for members to claim victory."
schumer_response: >
  No on-record quote; the AP reported aides said senators did not want him to micro-manage their disagreements,
  and that he asked Elizabeth Warren to focus criticism on the bill rather than its supporters.
