slug: fall-2025-shutdown-ends-without-aca-extension
title: >-
  Record 43-day shutdown ends as eight caucus members break ranks, without ACA deal
date: 2025-11-10
category: shutdowns-and-funding
status: verified
summary: >
  Senate Democrats blocked funding starting Oct. 1, 2025, demanding an extension of enhanced ACA subsidies.
  On Nov. 10 the Senate passed H.R. 5371 60-40 with eight caucus members voting yes (Cortez Masto, Durbin,
  Fetterman, Hassan, Kaine, King, Rosen, Shaheen); Schumer voted no. The deal included only a promised
  December vote on the subsidies, which failed 51-48 on Dec. 11. Trump signed the bill Nov. 12, ending
  the 43-day shutdown.
could_have: >
  Secure the caucus before the shutdown on what concession would end it, and use the leader's tools to
  hold or penalize defections. Per The Washington Post, Durbin, his No. 2, and Shaheen said Schumer never
  tried to dissuade them from backing the deal.
context: >
  Schumer led the shutdown fight after the March backlash and voted against the final deal. Per the Post,
  unnamed Democrats said he told negotiators he would vote no and urged wavering senators to hold out
  longer. The eight cited SNAP lapses, air travel disruption and federal layoffs. A leader cannot compel
  votes. In 2026, Democrats' refusal to fund DHS immigration functions without ICE reforms led to a 76-day
  DHS shutdown (Feb. 14-Apr. 30) that ended without those reforms (NPR).
schumer_response: >
  On the floor Nov. 9 he said the "health care crisis is so severe, so urgent, so devastating for families
  back home that I cannot in good faith support this CR" (Washington Post). He later said, "Americans
  will remember Republican intransigence every time they make a sky-high payment on health insurance"
  (AP).
