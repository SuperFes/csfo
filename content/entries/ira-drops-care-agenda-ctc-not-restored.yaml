slug: ira-drops-care-agenda-ctc-not-restored
title: >-
  IRA drops child care, pre-K and paid leave; expanded child tax credit never restored
date: 2022-08-07
category: economy-and-labor
status: verified
summary: >
  The Senate passed the Inflation Reduction Act 51-50 on Aug. 7, 2022, with Vice President Harris breaking
  the tie. At barely more than a tenth of the original $3.5 trillion plan, it abandoned universal preschool,
  paid family leave and expanded child care aid (PBS/AP). During the vote-a-rama, a Sanders amendment
  to restore the 2021 child tax credit rules paired with a corporate tax increase failed 1-97. In the
  December 2022 lame duck, the enhanced credit was again left out of the year-end spending package.
could_have: >
  The December 2022 omnibus was the last must-pass bill of unified Democratic control. Leadership could
  have made at least a partial restoration of the enhanced child tax credit a condition of its year-end
  deal.
context: >
  Manchin opposed the larger package as too costly and inflationary, and Democrats voted down amendments,
  including Sanders', to protect the negotiated deal. Any year-end tax deal needed 10 Republican votes,
  and CNBC reported Democrats had hoped to pair the credit with corporate tax breaks that were ultimately
  not considered.
schumer_response: null
