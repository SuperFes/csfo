slug: debt-ceiling-left-for-gop-house
title: Democrats leave the debt ceiling for a GOP House, setting up the 2023 standoff
date: 2022-12-22
category: shutdowns-and-funding
status: verified
summary: >
  In December 2021, a one-time Schumer-McConnell procedure let Democrats raise the debt limit by $2.5
  trillion on a 50-49 Senate vote, a level expected to last into 2023. After the November 2022 midterms,
  Schumer said he wanted to deal with the debt ceiling in the lame duck, but congressional leaders scheduled
  no vote and Congress adjourned without acting. Treasury hit the limit set by that 2021 law on Jan. 19,
  2023. The standoff with the new Republican House ended with the Fiscal Responsibility Act (June 3, 2023),
  which paired a suspension with spending caps and expanded SNAP work-requirement ages.
could_have: >
  Senate Democrats could have used budget reconciliation, which needs only a simple majority, to raise
  or suspend the limit during the lame duck while they still controlled both chambers. Roll Call reported
  that Sen. Dick Durbin had discussed the reconciliation option with Schumer.
context: >
  Reconciliation would have required a new budget resolution, scarce floor time and all 50 Senate Democrats;
  Roll Call identified Manchin as a likely obstacle to another reconciliation bill. Senate Republicans
  (McConnell, Thune) opposed lame-duck action, and House Speaker Pelosi also said she preferred a bipartisan
  approach. Axios later reported that not acting in the lame duck was among Democrats' chief regrets during
  the 2023 standoff.
schumer_response: >
  "Look, we'd like to get a debt ceiling done in this work period... The best way to get it done — the
  way it's been done the last two or three times — is bipartisan." (Roll Call, Nov. 15, 2022).
