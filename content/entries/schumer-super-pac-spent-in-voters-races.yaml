slug: schumer-super-pac-spent-in-voters-races
title: Schumer-aligned super PAC money paid for the races of the senators now deciding his future
date: 2026-11-17
category: party-and-primaries
status: needs-review
review_note: >
  Totals are our sum of WinSenate's 24- and 48-hour independent-expenditure reports to the FEC, covering
  spending through Nov. 1; they match its regular reports through Oct. 14 to within 1%. Final post-election
  reports are due Dec. 3.
summary: >
  WinSenate, a super PAC that gets almost all of its money from the Schumer-aligned Senate Majority PAC
  (FactCheck.org, Semafor), spent $282.3 million on 11 Senate races this cycle, by our count of its FEC
  reports. Democrats won all 11, and those winners now vote by secret ballot on whether Schumer stays
  leader. The most went to Ohio ($87.4 million, Sherrod Brown), Iowa ($47.8 million, Josh Turek), Michigan
  ($46.5 million, Abdul El-Sayed), Maine ($38.1 million, Troy Jackson), North Carolina ($21.7 million, Roy
  Cooper), New Hampshire ($18.9 million, Chris Pappas) and Kansas ($14.1 million, Adam Hamilton). AP
  reported that Schumer backed El-Sayed's and Peggy Flanagan's opponents in their primaries, "though he
  eventually put $67 million into El-Sayed's competitive race."
could_have: >
  Stay out of Democratic primaries, instead of backing the opponents of candidates who went on to win, as
  AP reported he did in Michigan and Minnesota.
context: >
  Of the seven biggest beneficiaries, only Brown has publicly backed Schumer. El-Sayed backs Van Hollen,
  Jackson and Hamilton say they won't vote for Schumer, Turek is undecided, and Cooper and Pappas haven't
  said. Van Hollen has said some senators won't back him publicly because of "an element of concern about
  political retaliation" (The Washington Sun). Most of the money, 88%, went to ads against Republicans,
  such as $78.3 million against Jon Husted in Ohio. Smaller amounts went to Alaska ($4.7 million), Mississippi
  ($2.2 million), South Carolina ($752,332) and Texas ($180,150); WinSenate reported nothing in Minnesota or
  Illinois. The totals leave out the DSCC, which also spent $12.3 million against Mike Rogers in Michigan,
  and other super PACs that took part of their money from Senate Majority PAC. Through Oct. 14, Senate
  Majority PAC had raised $354.4 million and moved $204.1 million to affiliated committees.
