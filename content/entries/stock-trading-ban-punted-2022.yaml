slug: stock-trading-ban-punted-2022
title: >-
  With a Democratic Senate, the stock-trading ban was punted past the 2022 election
date: 2022-09-15
category: ethics-and-corruption
status: verified
summary: >
  In May 2022, Majority Leader Schumer told reporters he hoped to have congressional stock-trading legislation
  to vote on "this year." In September, Sen. Jeff Merkley, who led the Senate working group Schumer had
  set up in February, said a vote was "not going to happen before the election." It did not happen. A
  bipartisan ban (the ETHICS Act) later cleared the Homeland Security Committee 8-4 in July 2024, while
  Democrats still held the majority, but it was not brought to the floor before that Congress ended. A
  2023 survey found 86% of registered voters favored banning members from trading individual stocks.
could_have: >
  As majority leader, Schumer controlled the floor schedule. He could have put a ban, such as the committee-passed
  2024 bill, to a recorded vote, making every senator take a position.
context: >
  Contemporaneous reporting placed much of the 2022 delay on the working group led by Merkley. A government-ethics
  advocate accused Merkley of having "slow-walked" the bill for 223 days. Merkley cited a calendar crowded
  with "other bills and judicial nominations." Any ban would also have needed 60 votes to overcome a filibuster.
  Watchdog group CREW noted at the time that Schumer had "promised to prioritize bringing a congressional
  stock trading ban to the floor before the election."
schumer_response: >
  In February 2022, Schumer said he had "asked my Democratic colleagues to come together and come up with
  a single bill this chamber can work on."
