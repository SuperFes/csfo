slug: letitia-james-indictment-dismissed
title: >-
  NY AG Letitia James indicted by unlawfully appointed prosecutor; Schumer issues statement
date: 2025-10-09
category: oversight-and-accountability
status: verified
summary: >
  On Oct. 9, 2025, a federal grand jury in Virginia indicted New York Attorney General Letitia James,
  a Democrat who had won a civil fraud judgment against Trump, on one count of bank fraud and one count
  of false statements to a financial institution. The case was brought by Lindsey Halligan, a former Trump
  personal attorney with no prosecutorial experience. On Nov. 24, 2025, U.S. District Judge Cameron McGowan
  Currie dismissed the indictment without prejudice. She held that Halligan had been "unlawfully serving"
  as interim U.S. attorney. Grand juries in Norfolk and Alexandria then declined to re-indict James in
  December 2025.
could_have: >
  Senate Democrats could have blocked fast-track confirmation of DOJ nominees and U.S. attorneys and forced
  recorded votes on each until DOJ answered for the Halligan installation. Schumer's statement announced
  no action.
context: >
  Schumer responded the same day with a strong statement. He had also criticized the Comey indictment
  two weeks earlier, saying he had "no faith in Trump's judicial system." The Halligan ruling covered
  her appointment, not the merits, and the White House maintains she was legally appointed.
schumer_response: >
  Statement on Oct. 9, 2025: "This is what tyranny looks like." He said Trump is "using the Justice Department
  as his personal attack dog," that "One U.S. Attorney already refused this case," that Trump "hand-picked
  an unqualified hack," and "This isn't justice. It's revenge." He announced no legislative or procedural
  action.
response_level: statement
tags:
- retaliation
