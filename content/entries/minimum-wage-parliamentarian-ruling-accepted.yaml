slug: minimum-wage-parliamentarian-ruling-accepted
title: >-
  $15 minimum wage dropped from COVID relief after parliamentarian ruling is accepted
date: 2021-02-25
category: economy-and-labor
status: verified
summary: >
  On Feb. 25, 2021, Senate Parliamentarian Elizabeth MacDonough advised that a phased $15 federal minimum
  wage did not meet budget-reconciliation rules for the American Rescue Plan. Democratic leaders did not
  challenge the ruling and the increase was removed. On March 5, 2021, Sen. Bernie Sanders' motion to
  waive the budget point of order failed 42-58, with eight members of the Democratic caucus voting no.
could_have: >
  The presiding officer (Vice President Harris) could have disregarded the advice, or the majority could
  have voted to overrule the chair or replaced the parliamentarian; some progressives publicly urged these
  steps (NPR). Leadership chose not to pursue them.
context: >
  The White House said Biden respected the parliamentarian's decision. Manchin and Sinema publicly opposed
  $15, and the March 5 vote showed eight Democratic-caucus senators (Carper, Coons, Hassan, King, Manchin,
  Shaheen, Sinema, Tester) unwilling even to waive the rule, so an overrule would very likely have lacked
  50 votes.
schumer_response: >
  "We are deeply disappointed in this decision. We are not going to give up the fight to raise the minimum
  wage to $15 to help millions of struggling American workers and their families." (statement quoted by
  CNBC and NPR). No federal minimum-wage increase passed during the Democratic majority.
