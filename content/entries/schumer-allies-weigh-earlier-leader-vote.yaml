slug: schumer-allies-weigh-earlier-leader-vote
title: Schumer allies discuss moving up the leadership vote
date: 2026-11-14
category: party-and-primaries
status: needs-review
review_note: >
  Based on private discussions reported by Politico and The Hill. No date change has been made.
summary: >
  Two days after Sen. Chris Van Hollen launched his challenge, Senate Democrats privately discussed holding
  the leadership election the week of Nov. 16, before the Thanksgiving recess, instead of Dec. 1. Party
  rules bar holding it before December, but the caucus can waive that rule (Politico). The Hill reported
  that Schumer's allies were discussing a November vote "to capitalize on Schumer's lead," and that Van
  Hollen's allies saw the idea as a sign Schumer is nervous.
could_have: >
  Keep the Dec. 1 date so senators have time to hear each candidate's plan, as Sen. Elissa Slotkin has
  asked for.
context: >
  Sen. Brian Schatz, running unopposed for whip, endorsed Schumer on Nov. 13 and said, "We must move
  quickly to vote, unify, and get to work" (Punchbowl News). Schumer's allies predict he will get more than
  40 votes (The Hill), while insiders doubt Van Hollen can reach the 28 or 29 needed to win (Politico).
  On Nov. 15, Van Hollen told CNN there were credible reports that "the Schumer team is trying to change
  the date of the election," and said, "I see it as a sign of weakness that they want to, they want to
  bring the date forward, rather than have this debate" (RealClearPolitics transcript). Schumer has not
  publicly weighed in on the timing, and even some of his allies doubt the vote will be moved (Politico).
