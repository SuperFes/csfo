slug: book-tour-postponed-march-2025
title: Schumer postpones book tour, citing security, as protests were planned
date: 2025-03-17
category: party-and-primaries
status: verified
summary: >
  On March 17, 2025, Schumer's office postponed events for his book "Antisemitism in America: A Warning"
  planned in Baltimore, Washington, New York, Philadelphia, Los Angeles and San Francisco. Spokesperson
  Risa Heller said, "Due to security concerns, Senator Schumer's book events are being rescheduled." Protests
  over his CR vote were expected at some events, including by local Indivisible chapters.
could_have: >
  Hold public events or town halls to take questions on the vote directly from the Democratic voters who
  were protesting it.
context: >
  The office's stated reason was security, and some hosts also cited security. There is no sourced evidence
  the stated reason was untrue.
schumer_response: >
  His office said the events were postponed "due to security concerns" and would be rescheduled (CBS News).
