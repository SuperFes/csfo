slug: salt-cap-repeal-pledge
title: >-
  Schumer vowed to kill the SALT cap, a change whose benefits go mostly to the top 1%
date: 2024-08-20
category: economy-and-labor
status: verified
summary: >
  At the 2024 Democratic National Convention, Schumer pledged, "We Democrats, as long as I'm leader, when
  state and local deductibility expires, it will be gone," referring to the $10,000 cap on the SALT deduction.
  In July 2020 he urged that the cap be removed in the next coronavirus relief package. Tax Policy Center
  estimates for the 2020 repeal proposal found about 57% of the benefit would go to the top 1% of households,
  96% to the top fifth, and about 4% combined to the middle 60%.
could_have: >
  Schumer could have pursued targeted relief for middle-income households in high-tax states, for example
  a higher cap phased out at high incomes, instead of pledging full repeal, which is mostly a tax cut
  for high earners.
context: >
  The SALT cap falls hardest on residents of high-tax states such as New York, so this reflects constituent
  politics, especially on Long Island, as much as donor interests. Schumer has also said he wants to undo
  Trump tax cuts that "went to the very wealthy," and that he backs not raising taxes on households under
  $400,000.
schumer_response: >
  "One of the issues that people care about on Long Island is state and local deductibility" (The Hill,
  Aug. 20, 2024).
