slug: big-tech-antitrust-no-vote
title: >-
  Schumer promised a vote on bipartisan Big Tech antitrust bills, then never held one
date: 2022-12-22
category: economy-and-labor
status: verified
summary: >
  Two bills cleared the Senate Judiciary Committee with bipartisan margins in 2022: the American Innovation
  and Choice Online Act, which barred dominant platforms from favoring their own products, and the Open
  App Markets Act. Schumer reportedly promised a floor vote from May 2022 onward. As majority leader he
  never scheduled one, and both bills were left out of the December 2022 omnibus and died with the 117th
  Congress. Tech companies and trade groups reportedly spent nearly $95 million lobbying against the bills.
  Schumer's two daughters worked at Amazon, as a lobbyist, and at Facebook.
could_have: >
  Schumer controlled the floor and could have scheduled a recorded vote on the committee-passed bills
  before the August 2022 recess or in the lame-duck session, or included them in the omnibus.
context: >
  Schumer's office said he was working to secure 60 votes, and advocates were told the bills would not
  get floor time without 60 committed senators. TIME reported that Schumer blamed Mitch McConnell for
  blocking them, while McConnell's office reportedly said the opposite. In place of the bills, Schumer
  added $85 million for FTC and DOJ antitrust enforcement and a merger-fee increase. His office denied
  that family employment affected his decisions, and the link remains speculation by critics, not an established
  finding.
schumer_response: >
  "I support these antitrust bills and it's something I believe in," and he was "not giving up" (statement
  to TIME, December 2022). A Schumer spokesman denied the family connections had any effect (The Intercept,
  April 2022).
