slug: jan-2018-shutdown-ended-without-daca
title: Schumer ended the January 2018 shutdown on a promise; Dreamers got no law
date: 2018-01-22
category: immigration
status: verified
summary: >
  Senate Democrats forced a shutdown on Jan. 20, 2018, over protections for DACA recipients. Two days
  later Schumer accepted Mitch McConnell's commitment to hold an immigration debate if no deal came by
  Feb. 8, and voted for cloture on a stopgap that passed 81-18. Days earlier he had offered President
  Trump $25 billion for a border wall in exchange for Dreamer protections, then withdrew it. On Feb. 15,
  2018, the Senate rejected a bipartisan plan 54-45 and Trump's plan 39-60, and no DACA bill passed.
could_have: >
  Schumer could have held out for a binding legislative vehicle, such as attaching DACA protections to
  must-pass spending, instead of reopening the government in exchange for a promise of floor debate.
context: >
  Fifteen Democrats and Sanders voted against reopening the government. Republicans controlled both chambers
  and the White House, and Trump rejected bipartisan deals; any Senate bill also faced the House. Courts
  temporarily blocked Trump's DACA termination, which reduced the immediate deadline pressure.
schumer_response: >
  On the floor Schumer said "the Republican leader and I have come to an arrangement" and that "The Republican
  majority now has 17 days to prevent the Dreamers from being deported." Withdrawing the wall offer, he
  said "We're going to have to start on a new basis, and the wall offer's off the table." After the Feb.
  15 votes he said Trump "stood in the way of every single proposal that has had a chance of becoming
  law."
