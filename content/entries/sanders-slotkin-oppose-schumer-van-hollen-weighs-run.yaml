slug: sanders-slotkin-oppose-schumer-van-hollen-weighs-run
title: Sanders and Slotkin say they won't back Schumer; Van Hollen weighs a challenge
date: 2026-11-10
category: party-and-primaries
status: needs-review
review_note: >
  Still developing. No senator has formally declared a challenge.
summary: >
  On Nov. 10, 2026, Sen. Bernie Sanders said, "the time is now for change, and I will not be supporting
  Chuck to be reelected as the Democratic leader." Sen. Elissa Slotkin appeared with him and said she
  supports change but is "not actively seeking this job"; on Nov. 7 she had said she was not ruling out
  a challenge. "Whoever wants my vote is going to have to show me a concrete plan that's definitely
  different. I'm a 'no' until and unless I see that from anyone," she said, and urged colleagues to withhold
  quorum at the leadership election until they get one (Roll Call). Sen. Chris Van Hollen, who AP reported
  is considering a challenge, said "we shouldn't have a coronation" and "I'm in listening mode and haven't
  shut the door." Indivisible has also urged Democrats to pick a new leader (TIME).
could_have: >
  Agree to a contested, transparent leadership election, or announce this will be his final term as leader,
  a compromise TIME reported was being floated.
context: >
  No senator had formally announced a challenge as of Nov. 10. Leader elections are by secret ballot and
  need only a caucus majority, and TIME and The Hill reported Schumer appears to have the votes. Sens.
  Booker, Gillibrand, Whitehouse, Mark Kelly and Ruben Gallego have spoken in his support; Kelly noted
  "nobody has officially stepped up to the plate" (Roll Call). The election is expected in December. This
  story is still developing.
schumer_response: >
  "I'm confident I will be elected majority leader," he said. "We have great unity in our caucus, and I'll
  be proud to lead it" (Roll Call).
