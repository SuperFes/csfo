slug: march-2025-cr-reversal-cloture-vote
title: >-
  Schumer says GOP lacks votes for its funding bill, then supplies them two days later
date: 2025-03-14
category: shutdowns-and-funding
status: verified
summary: >
  On March 12, 2025, Schumer said on the Senate floor that "Republicans do not have the votes in the Senate
  to invoke cloture on the House CR" and that his caucus was "unified on a clean April 11 CR." On March
  14, cloture on the House-passed full-year continuing resolution (H.R. 1968) was invoked 62-38. Schumer
  was one of ten members of the Democratic caucus voting yes (with Cortez Masto, Durbin, Fetterman, Gillibrand,
  Hassan, King, Peters, Schatz and Shaheen).
could_have: >
  Hold the caucus against cloture, which Republicans could not reach with their 53 seats alone, and force
  a vote on the short-term clean CR he had proposed. Failing that, coordinate the shift with House Democratic
  leaders, whom Pelosi praised the same day for rejecting the bill.
context: >
  Schumer argued a shutdown would hand the Trump administration and DOGE more power to decide which government
  functions continued. After supplying a cloture vote, Schumer voted no on final passage, which succeeded
  54-46 with a simple majority, so the decisive vote was cloture.
schumer_response: >
  On the floor on March 14 he said, "The CR is a bad bill. But as bad as the CR is, I believe allowing
  Donald Trump to take even much more power via a government shutdown is a far worse option," and that
  voting to keep the government open was "the best way to minimize the harm" (Congressional Record).
