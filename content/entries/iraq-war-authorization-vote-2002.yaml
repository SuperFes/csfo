slug: iraq-war-authorization-vote-2002
title: Schumer voted to authorize the Iraq War in 2002
date: 2002-10-11
category: foreign-policy
status: verified
summary: >
  Schumer voted yes on H.J.Res. 114, the authorization for use of military force against Iraq, which passed
  the Senate 77-23 in the early hours of Oct. 11, 2002. Twenty-one Democrats voted no. Twenty years later,
  in a statement to the AP, Schumer said that "with the luxury of hindsight, it's clear that the president
  bungled the war from start to finish."
could_have: >
  Schumer could have joined the 21 Senate Democrats who voted against the authorization.
context: >
  A majority of Senate Democrats (29 of 50) also voted yes, and the resolution would have passed without
  Schumer. As majority leader he later backed repealing the 2002 authorization.
schumer_response: >
  Per the AP (March 2023), Schumer's view at the time was that the president deserved the benefit of the
  doubt when the nation was under attack; in hindsight he said Bush "bungled the war" and should not have
  been given that benefit of the doubt.
