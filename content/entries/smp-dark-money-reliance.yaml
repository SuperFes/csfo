slug: smp-dark-money-reliance
title: Schumer-aligned super PAC took $102M from a nonprofit that hides its donors
date: 2026-10-14
category: ethics-and-corruption
status: needs-review
summary: >
  FEC filings show Senate Majority PAC (SMP), the super PAC AP describes as closely aligned with Schumer,
  received $102 million from Majority Forward between January 2025 and September 2026. That is about 29%
  of SMP's $354 million in 2025-26 receipts. Majority Forward is a 501(c)(4) that does not disclose its
  donors. SMP is headed by J.B. Poersch, a former DSCC executive director. Fox News reported that Poersch
  also leads Majority Forward and that the two groups share office space and staff. Public Citizen found
  that 80% of SMP's 2026 receipts came from 44 donors who each gave $1 million or more.
could_have: >
  Schumer could have asked his allied groups to voluntarily disclose all donors, or to refuse transfers
  from non-disclosing nonprofits, consistent with the disclosure rules Senate Democrats have proposed.
context: >
  Republican leadership-aligned groups use the same structure: One Nation and the Senate Leadership Fund.
  Democrats argue they cannot unilaterally disarm under Citizens United. SMP itself files with the FEC
  and itemizes donors over $200. Only Majority Forward's donors are hidden. Fox News, a partisan outlet,
  has contrasted this funding with Schumer's 2022 floor push for the DISCLOSE Act, when he said "we must
  cure this cancer of dark money." That quote has not yet been confirmed against a primary transcript.
schumer_response: null
