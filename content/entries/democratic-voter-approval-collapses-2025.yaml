slug: democratic-voter-approval-collapses-2025
title: Schumer's standing with Democrats drops sharply over 2025
date: 2025-12-22
category: party-and-primaries
status: verified
summary: >
  Economist/YouGov found Schumer's favorability among Democrats fell from 57% favorable / 18% unfavorable
  (Feb. 23-25, 2025) to 39% / 41% (March 16-18) after the CR vote. Pew (Sept. 22-28, 2025) found Democrats
  and leaners viewed him 35% favorably and 39% unfavorably, versus 47% / 26% in May 2024. Gallup (Dec.
  1-15, 2025) found 39% of Democrats approved of his job performance and 56% disapproved, versus 76% /
  20% two years earlier.
could_have: >
  Address the drop by committing to a leadership timeline; per AP, some senators privately wanted him
  to say this would be his last term as leader.
context: >
  Other congressional leaders of both parties also polled poorly. Pew found all four congressional leaders
  viewed more negatively than positively.
schumer_response: null
