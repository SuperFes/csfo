slug: barrett-confirmation-2020
title: >-
  Barrett confirmed 52-48 as Democrats relied on boycotts and a weakened ranking member
date: 2020-10-26
category: courts
status: verified
summary: >
  Amy Coney Barrett was confirmed Oct. 26, 2020, 52-48, eight days before the election, with every Democrat
  opposed. Democratic tactics consisted mainly of procedural motions and a Judiciary Committee boycott.
  Ranking member Dianne Feinstein closed the hearings by praising them as among the best she had taken
  part in and hugging Chairman Lindsey Graham, prompting NARAL and Demand Justice to call for her removal;
  Schumer said only that he had "a long and serious talk" with her.
could_have: >
  Schumer could have pressed for a change in Judiciary Committee leadership before, rather than after,
  the highest-stakes confirmation of the Trump era, and used every available dilatory tool to deny Republicans
  routine Senate business during the process.
context: >
  Democrats had 47 seats and could not block the nomination; the vote outcome would almost certainly not
  have changed. Feinstein announced in November 2020 she would not seek to remain ranking member.
schumer_response: >
  Schumer said "Democrats will not lend a single ounce of legitimacy to this sham vote in the Judiciary
  Committee," describing the boycott as "voting with our feet" (Roll Call). On Feinstein: "I've had a
  long and serious talk with Sen. Feinstein and that's all I'll say about it right now" (HuffPost).
