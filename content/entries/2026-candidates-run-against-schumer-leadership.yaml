slug: 2026-candidates-run-against-schumer-leadership
title: Democratic Senate candidates campaign on replacing Schumer as leader
date: 2026-04-07
category: party-and-primaries
status: verified
summary: >
  Through 2026, several Democratic Senate candidates said publicly that Schumer should not remain leader,
  including Graham Platner (Maine), Zach Wahls (Iowa), Mallory McMorrow (Michigan), Adam Hamilton (Kansas),
  Troy Jackson (Maine) and Abdul El-Sayed (Michigan). Wahls said "it is clear as day that it is time for
  him to step down." By October, AP reported Jackson, Hamilton and El-Sayed had said they would not vote
  for him or were noncommittal, even as the Schumer-aligned Senate Majority PAC spent millions on their
  races.
could_have: >
  Remove leadership as a campaign liability by announcing a transition or a final term, as some senators
  privately suggested (AP).
context: >
  Per Time, Schumer was prepared to support and fund candidates who opposed him if they won their primaries.
  Several sitting senators said the question should wait until after the election.
schumer_response: >
  In October he said, "I think our caucus is strong, it's united," and "A year ago, everyone said it was
  out of reach. Today, we have a broader map, strong candidates, a clear contrast" (AP). The DSCC told
  Time, "The DSCC has one goal: to win a Senate majority."
