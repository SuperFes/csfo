slug: schumer-signed-manchin-topline-memo
title: >-
  Schumer signed Manchin's $1.5T red-line memo in July 2021, then months of talks at $3.5T
date: 2021-07-28
category: other
status: verified
summary: >
  On July 28, 2021, Manchin and Schumer both signed a one-page document listing Manchin's conditions for
  the reconciliation bill, including a $1.5 trillion spending ceiling, with Schumer's handwritten note:
  "I will try to dissuade JOE of many of these." Manchin said signing it was a precondition for his vote
  on the budget resolution that allowed up to $3.5 trillion. The document became public on Sept. 30, 2021,
  amid a House standoff over the infrastructure bill and the size of the package.
could_have: >
  Leadership knew Manchin's stated ceiling months before the public fight. It could have shared it with
  the caucus and House Democrats and built the package around a realistic topline, instead of two months
  of negotiations premised on $3.5 trillion.
context: >
  The memo said Manchin did not guarantee his vote even within those terms, and he later rejected a roughly
  $1.75 trillion framework in December 2021, so earlier disclosure may not have changed the outcome. CNN's
  analysis argued Manchin had been consistent all along and that Schumer had known the ceiling since July.
schumer_response: >
  A Schumer spokesperson said he "never agreed" to the conditions and "merely acknowledged where Sen.
  Manchin was on the subject at the time," adding that Schumer "made clear that he would work to convince
  Sen. Manchin to support a final reconciliation bill." (Roll Call).
