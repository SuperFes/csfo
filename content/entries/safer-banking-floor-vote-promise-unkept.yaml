slug: safer-banking-floor-vote-promise-unkept
title: >-
  Schumer promised a cannabis-banking floor vote "as quickly as possible"; it never came
date: 2023-09-27
category: other
status: verified
summary: >
  On Sept. 27, 2023, the Senate Banking Committee advanced the bipartisan SAFER Banking Act 14-9, the
  first time a version of the cannabis-banking bill cleared a Senate committee. Schumer, a co-lead of
  the bill, said on the floor that day that he would bring it to the floor "as quickly as possible." Senate
  roll-call records show no floor vote on it through the end of the 118th Congress.
could_have: >
  As majority leader, Schumer could have filed cloture on the committee-reported bill at any point in
  the 15 months after his pledge.
context: >
  The bill needed 60 votes. Republican support beyond its GOP co-leads was uncertain, some Democrats such
  as Sen. Chris Van Hollen wanted criminal-justice provisions added before backing it on the floor, and
  Schumer himself planned to attach expungement and gun-rights provisions, which complicated negotiations.
schumer_response: >
  "Once it's reported out of committee, I will bring SAFER Banking to the floor for a vote as quickly
  as possible." (Schumer floor remarks, Sept. 27, 2023).
