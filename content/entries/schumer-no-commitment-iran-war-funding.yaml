slug: schumer-no-commitment-iran-war-funding
title: Schumer won't commit to using the funding bill to end the Iran war
date: 2026-11-12
people: [chuck-schumer]
category: foreign-policy
status: needs-review
review_note: >
  Still developing as government funding talks begin.
summary: >
  After the midterms, Schumer said Congress is "going to end the war" in Iran and called the power of the
  purse "one of the ways of deterring a president," but as of Nov. 12 he had not said Democrats would use
  the upcoming government funding bill to cut off money for it (Responsible Statecraft). Sen. Patty Murray,
  the top Democrat on the Appropriations Committee, said the war can't be ended "with the snap of our
  fingers" and favors a short-term stopgap, which Punchbowl News reports she would prefer to run into
  2027.
could_have: >
  Commit that Democrats will not vote for funding that pays for the war, as Van Hollen has.
context: >
  Sen. Chris Van Hollen, who is challenging Schumer for leader, said, "I will not support a single dime for
  Trump's illegal and senseless war in Iran" (Responsible Statecraft), and has made using the funding
  measure to end the war a centerpiece of his campaign (NBC News). On CNN on Nov. 15 he said Democrats must
  "use all our powers right now" to deny funding for the war; Punchbowl News reported Schumer does not
  agree. Current government funding runs out Dec. 11.
