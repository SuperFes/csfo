slug: swipe-fee-delay-vote-2011
title: Schumer voted with banks to delay the Durbin debit swipe-fee limits
date: 2011-06-08
category: economy-and-labor
status: verified
summary: >
  Schumer voted for the Tester amendment (S.Amdt. 392) to delay and restudy the Dodd-Frank cap on debit
  card "swipe" fees that banks charge merchants. The amendment got 54 votes but failed because it needed
  60; then-Whip Dick Durbin, the provision's author, voted no. CBS News reported that bank lobbyists told
  the Huffington Post that Schumer had worked behind the scenes to undermine the cap.
could_have: >
  Schumer, then the No. 3 Senate Democrat, could have voted with Durbin and most of the caucus to let
  the fee limits take effect on schedule.
context: >
  Eighteen other Democrats, including Gillibrand, also voted yes, so the split was bipartisan. The behind-the-scenes
  lobbying claim is attributed to unnamed bank lobbyists in secondary reporting.
schumer_response: null
