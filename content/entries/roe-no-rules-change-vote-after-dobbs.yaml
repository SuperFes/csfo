slug: roe-no-rules-change-vote-after-dobbs
title: >-
  No filibuster vote to restore Roe after Dobbs, despite Biden's call for a carve-out
date: 2022-06-30
category: reproductive-rights
status: verified
summary: >
  The Women's Health Protection Act failed cloture on Feb. 28, 2022 (46-48) and May 11, 2022 (49-51, with
  Manchin joining Republicans). After the Supreme Court overturned Roe on June 24, 2022, President Biden
  on June 30 called for a filibuster exception to codify it. Senate Democrats held no rules-change vote
  on abortion and no further Women's Health Protection Act vote for the rest of their majority; the 2024
  votes were on contraception, IVF and a bill expressing support for reproductive-care access.
could_have: >
  Leadership could have forced a recorded rules-change vote on an abortion-rights carve-out, as it did
  for voting rights in January 2022, putting each senator on record after Dobbs.
context: >
  Manchin voted against the bill itself, and Manchin and Sinema reiterated their opposition to changing
  the filibuster the day Biden spoke; Republicans Collins and Murkowski said the bill went beyond Roe.
  The votes to pass it or to change the rules did not exist in either Congress.
schumer_response: >
  Before the May 2022 vote: "Tens of millions of women are watching what will happen to the rights they've
  relied on for decades, and all of us will have to answer for this vote for the rest of our time in public
  office." (CNBC).
