slug: baraka-arrest-mciver-indictment
title: >-
  Newark mayor arrested and a House Democrat indicted after ICE facility oversight visit
date: 2025-05-09
category: oversight-and-accountability
status: verified
summary: >
  On May 9, 2025, federal agents arrested Newark Mayor Ras Baraka on a misdemeanor trespass charge outside
  Delaney Hall, an ICE detention facility, during an oversight visit by New Jersey House Democrats. Acting
  U.S. Attorney Alina Habba dropped the charge on May 19. A magistrate judge then called the arrest "hasty"
  and "a worrying misstep." Habba instead charged Rep. LaMonica McIver, and a grand jury indicted her
  on June 10, 2025, on three counts of assaulting, resisting and impeding federal officers. McIver has
  pleaded not guilty. On Aug. 26, 2026, a divided Third Circuit panel let two counts go to trial and sent
  the third back to the trial judge for Speech or Debate review.
could_have: >
  Senate Democrats could have tied their consent on DOJ and DHS nominees, or on DHS appropriations, to
  dropping the case against a sitting member or to a Public Integrity Section review. Schumer already
  had a hold on DOJ political nominees for other reasons and could have made the McIver prosecution an
  explicit condition of it.
context: >
  Schumer was holding DOJ political nominees at the time. In June 4, 2025 floor remarks he cited the Qatari
  jet matter and said the department was "politicized, it is weaponized, it is hollowed out." Those remarks
  did not mention McIver or Baraka. All of the Senate's Black Democrats issued a joint statement asking
  DOJ to drop the McIver charges. The courts have so far let the prosecution go forward: Judge Jamel Semper
  denied the motions to dismiss, and the Third Circuit largely agreed.
schumer_response: >
  On X on May 9, 2025: "Mayor Ras Baraka has been released, but he should never have been arrested by Trump
  to begin with." A RedState post quoting Fox News' Chad Pergram reported that on May 20, 2025 he called the
  McIver charges "outrageous" and typical of DOJ "trying to intimidate anybody who might oppose them"; that
  remark has not been found in a primary source. No floor action tied to these cases was found.
response_level: statement
tags:
- retaliation
