summary: >
  Gillibrand chaired the Democratic Senatorial Campaign Committee, Senate Democrats' campaign arm, through
  the 2026 midterms. In October 2025 the DSCC backed Maine Gov. Janet Mills in a contested Senate primary.
  Gillibrand called Mills "a formidable candidate" and said, "My general view is that primaries make
  candidates stronger" (HuffPost). Mills quit in April 2026, and Graham Platner won the primary. In 2025
  Gillibrand worked on the GENIUS Act stablecoin bill, and she was one of 16 Democrats who switched to
  advance it after the caucus had blocked it. Among her top employer sources of campaign contributions in
  2025-26 are Cantor Fitzgerald and the crypto firms Coinbase, Paradigm and Ripple.
