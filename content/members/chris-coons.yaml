summary: >
  Coons was one of eight Democratic-caucus senators who voted on March 5, 2021, against restoring the $15
  minimum wage to the American Rescue Plan; the motion failed 42-58. His office's statement said the
  minimum wage "has to be raised" and that he would work on legislation to raise and index it, without
  explaining the vote (WDEL). The month before, he had said it should rise "in a way that recognizes that
  some of our economic sectors, restaurants and hotels, in particular, have been hit particularly hard."
  On March 5, 2026, five years to the day later, he cosponsored Sanders' Raise the Wage Act ($17 by 2030).
  In 2017 he was one of 13 Democrats who voted down the amendment to allow drug imports from Canada. He won
  a new term on Nov. 3, 2026, with 63% (NBC10). Asked about the Schumer-Van Hollen race, he has not taken a
  side: "We are having a vigorous debate about the right mix of experience, capabilities, and vision"
  (Politico). He is the top Democrat on the Appropriations defense subcommittee.
