summary: >
  Schumer has led Senate Democrats since 2017. Federal Election Commission filings show his campaign
  committees have taken in $135.5 million since his first Senate race in 1998, $14.5 million of it from
  PACs and other political committees. Securities and investment was his top donor industry from 1989 to
  2014, per the Center for Public Integrity. In the 2021-22 cycle, people working at Blackstone, NextEra
  Energy, Newmark and KKR were among his largest sources of individual contributions. Senate Majority
  PAC, the super PAC most closely aligned with him, is covered in its own entry.
