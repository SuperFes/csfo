votes:
  - date: 2025-03-14
    title: Cloture on the House Republican funding bill (H.R. 1968)
    position: yea
    explanation: >
      Two days after saying Republicans lacked the votes to advance the bill, Schumer was one of ten
      members of the Democratic caucus who supplied them. Cloture was invoked 62-38.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1191/vote_119_1_00128.htm
  - date: 2021-03-05
    title: Motion to waive for the $15 minimum wage amendment (Sanders Amdt. 972)
    position: yea
    explanation: >
      Schumer voted to keep the $15 minimum wage in the American Rescue Plan after leadership declined to
      challenge the parliamentarian's ruling against it. The motion failed 42-58, with eight members of
      the Democratic caucus voting no.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1171/vote_117_1_00074.htm
    policy: minimum-wage
  - date: 2018-03-14
    title: Passage of the Dodd-Frank rollback (S. 2155)
    position: nay
    explanation: >
      Schumer voted no, but the AP reported he did not try to stop the bill. It passed 67-31 with 16
      Democrats and Angus King voting yes.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1152/vote_115_2_00054.htm
  - date: 2011-06-08
    title: Delay of the debit-card swipe-fee cap (Tester Amdt. 392)
    position: yea
    explanation: >
      Schumer voted to delay and restudy the Dodd-Frank cap on swipe fees, which banks had lobbied against. The amendment
      got 54 votes but failed to reach 60. Its author, then-Whip Dick Durbin, voted no.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1121/vote_112_1_00086.htm
  - date: 1999-11-04
    title: Repeal of Glass-Steagall's core barriers (S. 900 conference report)
    position: yea
    explanation: >
      In his first year in the Senate, Schumer voted for and championed the Gramm-Leach-Bliley Act, which
      let banks, securities firms and insurers combine. It passed 90-8.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1061/vote_106_1_00354.htm
