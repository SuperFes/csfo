summary: >
  Aguilar chairs the House Democratic Caucus and is running for majority whip in the Nov. 18 House
  Democratic leadership elections. From January 2025 through Oct. 14, 2026, his campaign took $1.42 million
  from corporate PACs, more than any other House Democrat, and corporate PACs made up 57% of the $2.5
  million he raised from PACs (Sludge). In July 2025 he voted for both of the crypto industry's priority
  bills, the GENIUS Act on stablecoins and the CLARITY Act on market structure. Most House Democrats,
  including Jeffries and Katherine Clark, voted against CLARITY.
