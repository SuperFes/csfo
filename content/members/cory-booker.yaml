summary: >
  Booker became the No. 4 Senate Democrat in December 2024 (Roll Call) and won a third full term on Nov. 3,
  2026; Colorado Politics reported he may move up to the No. 3 spot Klobuchar is leaving. On Jan. 11, 2017,
  he was one of 13 Democrats who voted down Klobuchar and Sanders' amendment to allow cheaper prescription
  drugs to be imported from Canada, which failed 46-52; he said any importation plan "should also include
  consumer protections that ensure foreign drugs meet American safety standards." The Intercept, citing
  MapLight, reported he had taken more from drug manufacturers over six years than any other Senate
  Democrat. He co-introduced an importation bill with Sanders weeks later and that June said he had put "a
  pause on even receiving contributions from pharma companies." In 2025 he was one of 18 Democrats who
  voted to pass the GENIUS Act stablecoin bill, voted to confirm Treasury Secretary Scott Bessent, and was
  the only Democrat to vote to confirm Charles Kushner as ambassador to France. In August 2026 he said "It's
  time for new leadership" and that Schumer "will be the last baby boomer head of our party in the Senate"
  (New Jersey Globe); after the midterms he said, "We're gonna have a family discussion," and that America
  "should give … Chuck Schumer his due" (Al Jazeera). He has cosponsored Medicare for All, the PRO Act and
  the FAMILY Act paid-leave bill.
