role: Chair, Senate Democratic Steering and Policy Committee (No. 3)
inclusion:
  - leadership
status: verified
summary: >
  Klobuchar became the No. 3 Senate Democrat in December 2024 as chair of the Steering and Policy Committee
  (Roll Call). She won Minnesota's governor's race on Nov. 3, 2026, opening up her leadership spot, and has
  not said when she will resign her Senate seat (KTTC). In 2013 she and Republican Orrin Hatch teamed up on
  an amendment to repeal the Affordable Care Act's medical-device tax; NPR reported that Medtronic was one of her top campaign contributors. It passed 79-20. Running
  for president in 2019, she said of Medicare for All, "I don't think that's a bold idea, I think it's a bad
  idea" (MPR News). In 2025 she voted to confirm several Trump nominees most Democrats opposed, including
  Transportation Secretary Sean Duffy, Interior Secretary Doug Burgum, ambassador to Turkey Tom Barrack (one
  of seven Democratic-caucus yes votes) and Deputy Commerce Secretary Paul Dabbar (one of four). She also led
  the 2017 amendment to allow cheaper drug imports from Canada, voted to restore the $15 minimum wage in 2021,
  and wrote the tech antitrust bill that Big Tech spent heavily to stop and that never got a floor vote.
