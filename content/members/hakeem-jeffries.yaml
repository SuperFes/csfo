summary: >
  Jeffries has led House Democrats since January 2023. Federal Election Commission filings show his House
  campaign committee has taken in $56.7 million since his first race in 2012, $40.9 million of it in the
  two cycles since he became leader and $11.2 million from PACs and other political committees. In the
  2023-24 cycle, people working at Apollo Global Management, BlackRock, MetLife and Lockheed Martin were
  among his largest sources of itemized individual contributions. He defended Schumer's leadership after
  the November 2025 shutdown deal.
