summary: >
  Jeffries has led House Democrats since January 2023. Federal Election Commission filings show his House
  campaign committee has taken in $56.7 million since his first race in 2012, $40.9 million of it in the
  two cycles since he became leader and $11.2 million from PACs and other political committees. In the
  2023-24 cycle, people working at Apollo Global Management, BlackRock, MetLife and Lockheed Martin were
  among his largest sources of itemized individual contributions. From January 2025 through Oct. 14, 2026,
  his campaign took $1.32 million from corporate PACs, second among House Democrats (Sludge). AIPAC
  endorses him and calls him "a pro-Israel leader" (Jewish Insider). FEC filings show $1.53 million in
  individual donations that AIPAC's PAC collected and passed to his campaign and fundraising committees
  since 2021. Jeffries has described the PAC's giving as capped: it "can contribute, in a given election
  cycle, $5,000 or $10,000 per cycle, that's it" (Sludge). He
  cosponsored the Medicare for All Act in each Congress from 2013 through 2022 but not since becoming
  leader; on Aug. 16, 2026, he told NBC's Meet the Press, "It's not legislation that I currently am
  co-sponsoring or that I support," and asked whether he personally supports it, said, "No" (Common
  Dreams). In the summer he met privately with Jared Kushner (New York Times), later saying Kushner "asked
  for a meeting, and I took it to discuss the affordability crisis" (CNN). Asked on Nov. 12 about Sen.
  Chris Van Hollen's push to strip a provision integrating the U.S. and Israeli militaries from the
  defense bill, he did not say where he stood (Truthout). Of a DSA crowd that chanted "You're next!" at his
  picture, he told CNN, "there was almost zero diversity in that crowd." He defended Schumer's leadership
  after the November 2025 shutdown deal.
