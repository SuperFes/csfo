summary: >
  Clark is the House Democratic whip and is running for majority leader in the Nov. 18 House Democratic
  leadership elections. Her campaign reported $1.11 million in corporate PAC contributions this cycle,
  fourth among House Democrats (Sludge). AIPAC endorsed her and has contributed to her campaign in the
  past; she won her 2026 primary over two challengers who faulted her for not renouncing AIPAC money (Fox
  News). In July 2025 she voted for the GENIUS Act, the crypto industry's stablecoin bill.
