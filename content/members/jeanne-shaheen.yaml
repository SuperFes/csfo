summary: >
  Shaheen was one of eight Democratic-caucus senators who voted on March 5, 2021, against restoring the $15
  minimum wage to the American Rescue Plan; the motion failed 42-58. She later said, "I support raising the
  minimum wage to $15 with safeguards in place for small businesses and restaurants that have been
  especially hard-hit by the pandemic" (Concord Monitor), but she has not cosponsored any version of the
  Raise the Wage Act. In March 2025 she and Angus King were the only two caucus members to vote for final
  passage of the House Republican stopgap bill, and she was one of eight who voted to end the fall 2025
  shutdown without the Affordable Care Act subsidy extension. She also voted for the Laken Riley Act. She is
  the top Democrat on the Foreign Relations Committee and did not run again in 2026; her term ends Jan. 3,
  2027.
