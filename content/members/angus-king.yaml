summary: >
  King, an independent who caucuses with Democrats, was one of eight caucus members who voted on March 5,
  2021, against restoring the $15 minimum wage to the American Rescue Plan; the motion failed 42-58. He said
  he supported $15 but objected to the bill's elimination of the tip credit, feared losing Democratic votes
  on the whole package, and called the 60-vote amendment "a purely symbolic vote" in which "my vote made
  zero difference in the final outcome." He has not cosponsored any version of the Raise the Wage Act. In
  March 2025 he and Jeanne Shaheen were the only two caucus members to vote for final passage of the House
  Republican stopgap bill, which he called "the least worst option," and he was one of eight who voted to
  end the fall 2025 shutdown without the Affordable Care Act subsidy extension. On Nov. 12, 2026, he backed
  Schumer for leader: "Why would you fire the manager when you just won the World Series?"
