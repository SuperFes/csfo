summary: >
  Hassan was one of eight Democratic-caucus senators who voted on March 5, 2021, against restoring the $15
  minimum wage to the American Rescue Plan; the motion failed 42-58. "I've long supported raising the
  minimum wage to $12 an hour and I'm open to $15 an hour," she said. "We need a path forward that is
  appropriate for workers and small businesses and could actually pass" (Boston.com). She has not
  cosponsored any version of the Raise the Wage Act since. She sits on the HELP Committee, which handles the
  minimum wage. In 2025 she was one of 10 Democratic-caucus senators who voted to advance the Republican
  stopgap funding bill in March, and one of eight who voted to end the fall shutdown without the
  Affordable Care Act subsidy extension Democrats had demanded. She also voted for the Laken Riley Act and
  was one of 18 Democrats who voted to pass the GENIUS Act stablecoin bill. Her term runs through January
  2029.
