    title: Passage of the funding deal that ended the shutdown (H.R. 5371)
    position: yea
    explanation: >
      Durbin was one of eight members of the Democratic caucus who voted yes, ending the 43-day shutdown
      without an extension of enhanced ACA subsidies. It passed 60-40.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1191/vote_119_1_00618.htm
  - date: 2025-03-14
    title: Cloture on the House Republican funding bill (H.R. 1968)
    position: yea
    explanation: >
      Durbin was one of ten members of the Democratic caucus, Schumer among them, who supplied the votes
      for cloture. It was invoked 62-38.
    url: https://www.senate.gov/legislative/LIS/roll_call_votes/vote1191/vote_119_1_00128.htm
