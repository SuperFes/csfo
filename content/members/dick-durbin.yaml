summary: >
  Durbin has been Senate Democratic whip, the caucus's No. 2, since 2005. He announced in April 2025 that
  he would not seek reelection in 2026, so his term ends in January 2027. Federal Election Commission
  filings show his Senate campaign committee has taken in $47.0 million since 1996, $10.4 million of it
  from PACs and other political committees. In his last reelection cycle (2019-20), people working at
  Jenner & Block, Kirkland & Ellis and United Airlines were among his largest sources of itemized
  individual contributions. In 2025 he voted to advance or pass both funding bills that most Senate
  Democrats opposed.
