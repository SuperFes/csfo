summary: >
  Schatz is the Senate Democrats' chief deputy whip and is running unopposed to become whip in the next
  Congress, with Schumer's endorsement since August 2025 (Punchbowl News). On March 14, 2025, he was one of
  ten members of the Democratic caucus who voted to advance the House Republican funding bill, then voted
  against its final passage. On Nov. 13, 2026, a day after Sen. Chris Van Hollen launched his challenge,
  Schatz said, "I endorse Senator Schumer for leader and will be voting for him in the caucus election,"
  and, "We must move quickly to vote, unify, and get to work" (Punchbowl News). His campaign has raised
  $1.8 million in 2025-26, $454,947 of it from PACs and other political committees.
