summary: >
  Stevens has represented Michigan's 11th District since 2019 and gave up the seat to run for Senate in
  2026. She lost the Aug. 4 Democratic primary to Abdul El-Sayed by about one point, after AIPAC and its
  affiliates spent close to $30 million backing her (AP), and offered him her support in her concession.
  On Nov. 1, two days before the general election, she appeared at a Mike Rogers campaign event in Detroit
  and said, "I am going to cast my vote for Senate for Mike Rogers," adding, "Abdul made it clear I was not
  welcome" (FOX 2 Detroit). Michigan Democratic Party Chair Curtis Hertel said she "is not a current member
  of the Michigan Democratic Party, nor will she be in the future" (Jerusalem Post). El-Sayed won by about
  seven points (NPR). The next day Stevens wrote, "As a woman, I have the right to make a decision and to
  change my mind," and said she regretted her original endorsement of him. Her House term ends Jan. 3,
  2027.
