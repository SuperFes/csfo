slug: senate-leader-2026
title: Senate Democratic leader race
election_date: 2026-12-01
updated: 2026-11-17
status: needs-review
review_note: >
  Developing. Counts only on-the-record statements and will change before the vote. Some quotes are
  fragments as the outlet published them, and TIME and Roll Call differ on Stratton.
  Politico counted Alsobrooks for Schumer on Nov. 15, but on Nov. 16 she declined to take a side (The
  Washington Sun).
summary: >
  Sen. Chris Van Hollen is challenging Chuck Schumer to lead Senate Democrats in the new majority. The caucus
  votes by secret ballot, set for Dec. 1, though Schumer's allies have discussed moving it earlier. This page
  lists every senator and senator-elect who has said publicly where they stand, with their own words and a
  source for each.
