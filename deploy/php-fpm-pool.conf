[csfo]
user = csfo
group = csfo
listen = /run/php/csfo.sock
listen.owner = www-data
listen.group = www-data

; Sized for 1 GB RAM. Most traffic should be served by the CDN and the
; response cache, so few workers are needed.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
php_admin_flag[expose_php] = off
